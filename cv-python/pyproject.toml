[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["__pycache__", ".venv", "data", "dist", "build"]

[tool.ruff.lint]
# E, F: pyflakes + pycodestyle errors
# W: pycodestyle warnings
# B: flake8-bugbear (real bugs)
# I: isort (import sorting)
# UP: pyupgrade (modern Python idioms)
# C4: flake8-comprehensions
# SIM: flake8-simplify
# RET: flake8-return
# S: flake8-bandit (security checks during lint; complements the standalone Bandit run)
# C90: mccabe complexity, held to the ceiling below (#617)
# PLE, PLW: pylint's errors and warnings
# PLR1714: repeated equality comparisons, merged into one membership test
# RUF059: an unpacked variable never used. With F841, S110 and PLW0108 (an
# unnecessary lambda, in PLW) it is a local twin of a CodeQL quality rule this
# code has met (#1736, docs/tech/gates.md), so a finding GitHub's Code quality
# tab would show fails the gate first.
# Pylint's other refactor rules stay off. PLR0912 counts branches, which C90
# already measures. PLR0913 and PLR0915 count a function's tuning parameters
# and lines, which this CV code has many of. PLR2004 calls every calibrated
# pixel or ratio threshold a magic number.
select = ["E", "F", "W", "B", "I", "UP", "C4", "SIM", "RET", "S", "C90", "PLE", "PLW", "PLR1714", "RUF059"]
ignore = [
  "E501",  # line too long — we set line-length=120, but some strings legitimately exceed
  "E741",  # ambiguous variable name (l, I, O) — we use `l` for label in CV code
  "UP015", # mode='r' is default — explicit is fine for readability
]

[tool.ruff.lint.mccabe]
# A ceiling for new code, not one fitted over the most complex function in
# the service, which would let every other function grow to it. 15 is NIST
# SP 500-235's ceiling for a team that justifies going above McCabe's own 10.
# No function is above it (#1654); the ceiling can move toward 10 when a
# measurement says what that would cost.
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["F401", "F841", "S101"]  # tests may have unused imports/vars; assert is fine in tests (S101)
"tests/*.py" = ["S101"]                  # assert is fine in tests
"__init__.py" = ["F401"]                 # re-exports

[tool.ruff.format]
# Defaults are fine; opting in explicitly so `ruff format --check` is part of CI.

[tool.mypy]
python_version = "3.12"
files = ["app"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true
# Every function outside `app.cv` declares its argument and return types
# (#1185). `app.cv.*` is still skipped by the override below.
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["cv2.*", "easyocr.*", "skimage.*", "scipy.*", "pyproj.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# `app.cv.*` is skipped: mypy follows imports from routes/utils into it, where
# the numpy and cv2 stubs report findings that are not defects in this code.
# Which of the two CV pipelines stays is #624's to decide, and the module is
# typed once that is settled.
module = "app.cv.*"
follow_imports = "skip"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=app --cov-report=term-missing"

[tool.coverage.run]
omit = ["tests/*"]

[tool.bandit]
exclude_dirs = ["tests"]
# `assert` is fine in tests; tests are excluded above. For prod code we keep
# the default severity floor and require `# nosec <CODE> -- reason` per the
# suppression policy (docs/tech/development-guide.md § Linter Suppressions).
