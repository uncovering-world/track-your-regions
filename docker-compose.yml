services:
  db:
    image: postgis/postgis:17-3.5-alpine  # Alpine has GEOS 3.12+; Debian has 3.9 which lacks ST_CoverageSimplify
    container_name: ${STACK_NAME:-tyr-ng}-db
    environment:
      POSTGRES_DB: ${DB_NAME:-track_regions}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro,z
    # Over TCP, not the socket: a fresh volume runs db/init on a temporary
    # server that listens on the socket alone and then restarts, so a probe
    # through the socket calls it healthy and a backend started on that word
    # connects into the restart and is refused (#775). The start period
    # covers the init scripts, whose failures do not count against retries.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${DB_USER:-postgres} -d ${DB_NAME:-track_regions}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 120s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # The rules both sides apply live outside either package's context
      # (packages/shared, ADR-0065). A named context hands the directory to
      # the build — its own .dockerignore applies — without widening the
      # context to the whole checkout; the Dockerfile copies it to
      # /packages/shared, where the package's file: link resolves from /app.
      additional_contexts:
        shared: ./packages/shared
    container_name: ${STACK_NAME:-tyr-ng}-backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-track_regions}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      NODE_ENV: ${NODE_ENV:-development}
      CV_PYTHON_URL: http://cv-python:8000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Authentication
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      # Google OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Apple Sign-In (TODO: untested, requires Apple Developer account)
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
      # Email (SMTP) — optional in dev, falls back to console logging
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@localhost}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      # The contact outbound requests publish; empty means this project's own.
      USER_AGENT_CONTACT: ${USER_AGENT_CONTACT:-}
      # The door the Archaeology run reads OpenStreetMap through; empty means
      # the QLever mirror, `overpass` the public Overpass API (#893).
      OSM_READER: ${OSM_READER:-}
      BIND_ADDR: 0.0.0.0
      # Development-only: read a sync source from local JSON instead of the live
      # API. Point it inside /app/data, which is already mounted. Refused when
      # NODE_ENV is production — see docs/security/SECURITY.md
      SYNC_SOURCE_FIXTURE: ${SYNC_SOURCE_FIXTURE:-}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3001}:3001"
    volumes:
      - ./backend/src:/app/src:ro,z
      # The shared rules package is baked into the image (see the build
      # context above); its source is mounted over that copy so an edit on the
      # host reaches tsx watch and the unit lane, the way ./backend/src does.
      - ./packages/shared/src:/packages/shared/src:ro,z
      # The backend's vitest run is also the runner for the repository's own
      # tooling specs (`../scripts/**/*.test.mjs`, #923) and for the shared
      # package's (`../packages/shared/src/**/*.test.ts`, ADR-0065). Inside the
      # container those globs resolve to /scripts and /packages/shared/src, and
      # without the mounts they would match nothing and the container lane
      # would pass having run none of them — a lane that quietly does not run,
      # which is what #432 was.
      - ./scripts:/scripts:ro,z
      #
      # The three below are the same shape, louder: a dozen backend specs hold a
      # claim in code against the file that states it — the schema, a numbered
      # migration, Martin's config, a frontend module spelling the same rule for
      # the browser. They find those through `src/testSupport/repoFile.ts`, whose
      # root is the nearest ancestor holding `db/init/01-schema.sql`; here that is
      # `/`, which is why these sit at the container root beside /scripts rather
      # than under /app. Without them the container lane failed 18 test files on
      # paths that were simply not there, while the host lane and CI — which check
      # out the whole repository — stayed green (#948). Read-only: a test run has
      # no business writing to the checkout. `frontend/src` rather than
      # `frontend`, to leave that package's node_modules and build output out.
      - ./db:/db:ro,z
      - ./frontend/src:/frontend/src:ro,z
      - ./martin:/martin:ro,z
      # And two files on their own, for the same reason: `scripts/gates.test.mjs`
      # pins the gate map against the table `docs/tech/gates.md` carries, and
      # `scripts/ci-failsafe.test.mjs` pins the fail-safe clause every CI job's
      # `if:` carries against the workflow that states it (#952), so both have to
      # be readable here too. Neither directory is mounted whole: the suite reads
      # these two files and nothing else under `docs` or `.github`, and the rest
      # of `docs` is megabytes of prose a test run has no business opening
      # (#783).
      - ./docs/tech/gates.md:/docs/tech/gates.md:ro,z
      - ./.github/workflows/ci.yml:/.github/workflows/ci.yml:ro,z
      - ${DATA_DIR:-./data}:/app/data:z
    depends_on:
      db:
        condition: service_healthy
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # The same named context as the backend's: the frontend links the same
      # package (ADR-0065).
      additional_contexts:
        shared: ./packages/shared
    container_name: ${STACK_NAME:-tyr-ng}-frontend
    environment:
      # Defaults target the host-mapped ports, for a browser running on the
      # host (the normal dev workflow: `npm run dev`, open localhost:5173).
      # The isolated test stack (scripts/test-stack.sh) overrides both to the
      # backend/martin container hostnames instead, because there the browser
      # navigating these URLs runs inside the `e2e` container on the compose
      # network, where "localhost" is that container, not the host.
      #
      # The override variables are named *_OVERRIDE, deliberately not
      # VITE_API_URL/VITE_MARTIN_URL: .env.example shipped fixed values for
      # those two names until this change, and scripts/setup.sh copied them
      # into every developer's .env, where they remain. Compose only
      # evaluates a "${VAR:-default}" fallback when VAR is entirely unset -
      # a value from .env counts as set. Reusing those names here would
      # have made the nested
      # `${BACKEND_PORT:-3001}` default unreachable for any dev stack whose
      # .env came from setup.sh, silently pinning the frontend to port 3001
      # even after changing BACKEND_PORT.
      VITE_API_URL: ${FRONTEND_API_URL_OVERRIDE:-http://localhost:${BACKEND_PORT:-3001}}
      VITE_MARTIN_URL: ${FRONTEND_MARTIN_URL_OVERRIDE:-http://localhost:${MARTIN_PORT:-3000}}
      # `dev` (Vite dev server) or `preview` (a production build, served
      # compressed). The performance lane in scripts/test-stack.sh sets
      # `preview`; everything else leaves the default. The image's own CMD
      # (frontend/docker-entrypoint.sh) reads it — no `command:` override
      # here, so the two cannot drift.
      FRONTEND_MODE: ${FRONTEND_MODE:-dev}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/app/src:ro,z
      - ./frontend/index.html:/app/index.html:ro,z
      # The shared rules package's source over the copy baked into the image,
      # so an edit reaches Vite's watcher the way ./frontend/src does.
      - ./packages/shared/src:/packages/shared/src:ro,z
    depends_on:
      - backend

  # Martin Vector Tile Server
  # Serves MVT tiles directly from PostGIS for fast map rendering
  martin:
    image: ghcr.io/maplibre/martin:v0.14.2
    container_name: ${STACK_NAME:-tyr-ng}-martin
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-track_regions}
    ports:
      - "${MARTIN_PORT:-3000}:3000"
    volumes:
      - ./martin/config.yaml:/config.yaml:ro,z
    depends_on:
      db:
        condition: service_healthy
    command: ["--config", "/config.yaml"]
    # No restart policy on purpose: with `unless-stopped`, a docker daemon
    # restart resurrects Martin without the db (which has no policy), causing
    # an endless crash-loop whose log backlog floods the next `compose up`.

  cv-python:
    build:
      context: ./cv-python
      dockerfile: Dockerfile
    container_name: ${STACK_NAME:-tyr-ng}-cv-python
    # No host port mapping — service is reachable only on the internal Docker
    # network at http://cv-python:8000. The CV pipeline endpoints (`/pipeline/*`
    # added in rebuild/41-43) accept operator decisions for in-progress reviews
    # and would bypass the Node.js auth layer if exposed on the host. For
    # ad-hoc dev access, add a `ports:` block in `docker-compose.override.yml`.
    expose:
      - "8000"
    volumes:
      - ./cv-python/app:/app/app:ro,z
      - ${DATA_DIR:-./data}:/app/data:z
    environment:
      - PYTHONUNBUFFERED=1
    # No restart policy on purpose — see the note on the martin service.

  # One-off GADM loader (GDAL + psycopg2 + dotenv + shapely). Not started by
  # `docker compose up` (tools profile); invoked by `npm run db:load-gadm` via
  # `docker compose run --rm db-loader ...`, so the host needs no Python/GDAL.
  db-loader:
    build:
      context: ./db
      dockerfile: Dockerfile
    image: ${STACK_NAME:-tyr-ng}-db-loader
    profiles: ["tools"]
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-track_regions}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - ./db:/app/db:ro,z
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
