name: Bug Report
description: Something behaves differently from what the product or the docs promise
type: Bug
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is. Name the real object (a site, a museum, a region) it shows on.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: The exact sequence of actions and the result of each step.
      placeholder: |
        1. Open …
        2. Click …
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What happens instead. Include error messages and stack traces if available — redacted first, with no tokens, credentials, secrets or personal data.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit Version
      description: The commit (or branch) where the bug reproduces.
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: OS and version; browser, if a frontend issue
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Screenshots, logs or console output, the patterns or scenarios the issue occurs in. Redact before pasting — no tokens, credentials, secrets or personal data; leave out what cannot be safely redacted.
  - type: textarea
    id: solution
    attributes:
      label: Possible Solution
      description: If you have a suggestion for how the bug might be fixed.
