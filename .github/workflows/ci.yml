name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}
  # The calendar is an input the map cannot name. Trivy, `npm audit` and
  # `pip-audit` answer from vulnerability databases, so their verdict changes
  # when a CVE is published, not when a file moves; before #783 every push
  # re-asked them, and under the map a base-image CVE disclosed after the last
  # cv-python change would be found by nothing. A scheduled run carries no
  # base, so the Changes job sends the zero sha and every gate applies.
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

# A push to a pull request cancels the run on the head it replaced (#920). That
# run's verdict answers for a commit nobody will merge, and before this a
# force-pushed fix wave left it executing to the end — the smoke stack and
# Lighthouse included. Only a pull request is ever cancelled: every other run
# gets a group of its own (`run_id`), so a push to main, the weekly schedule and
# a dispatch always finish. A shared group with `cancel-in-progress: false`
# would not be enough — GitHub keeps one pending run per group, so a third push
# to main would still replace a second one that had not started.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What this change asks for, decided once and read by every job below
  # (#783, ADR-0062).
  #
  # The filter sits on the jobs and never on `on:`. A workflow skipped by a
  # `paths:` filter never reports its checks at all, so the contexts required
  # by branch protection — Lint & Type Check, Security Scan, Unit Tests — stay
  # Pending for ever and the merge button never lights up. A job skipped by its
  # own `if:` reports Success and satisfies the same required check. That one
  # asymmetry is the whole reason this job exists.
  #
  # It decides nothing itself: scripts/gates.mjs is the only place an input is
  # mapped to the gates that read it. This job just tells it which range to
  # look at, and publishes the answer as outputs.
  #
  # A detection job that fails skips nothing: every `if:` below reads
  # `needs.changes.result != 'success'` first, so a broken decision makes every
  # job run. That is the map's own rule for a change set it cannot work out,
  # applied one level up — and without it a failure here would skip the three
  # required contexts, each of which would report Success and leave a pull
  # request mergeable on which nothing ran at all.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.gates.outputs.base }}
      job_check: ${{ steps.gates.outputs.job_check }}
      job_check_node: ${{ steps.gates.outputs.job_check_node }}
      job_check_python: ${{ steps.gates.outputs.job_check_python }}
      job_check_docs: ${{ steps.gates.outputs.job_check_docs }}
      job_test: ${{ steps.gates.outputs.job_test }}
      job_python_tests: ${{ steps.gates.outputs.job_python_tests }}
      job_build: ${{ steps.gates.outputs.job_build }}
      job_security: ${{ steps.gates.outputs.job_security }}
      job_security_node: ${{ steps.gates.outputs.job_security_node }}
      job_security_python: ${{ steps.gates.outputs.job_security_python }}
      job_trivy: ${{ steps.gates.outputs.job_trivy }}
      job_smoke: ${{ steps.gates.outputs.job_smoke }}
      job_test_db: ${{ steps.gates.outputs.job_test_db }}
      job_perf: ${{ steps.gates.outputs.job_perf }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The base of the comparison is a commit rather than a branch tip,
          # and the default shallow clone would not contain it. Without it
          # there is no merge base, so the change set is unknown and every
          # gate runs — safe, and exactly the cost this job exists to avoid.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Decide which gates this change asks for
        id: gates
        env:
          # Through the environment rather than interpolated into the script:
          # these are commit shas today, and a workflow expression pasted into
          # a shell line is how that stops being true safely.
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            # The pull request's base, not its own previous head: the range is
            # everything the branch adds on top of main, so a gate cannot be
            # skipped because the last push of a branch happened to touch
            # nothing it reads.
            pull_request) BASE="$PULL_REQUEST_BASE" ;;
            # On a push to main after a rebase merge, `before` is the previous
            # tip of main, so the pushed range is exactly what the merge
            # brought and nothing else.
            push) BASE="$PUSH_BEFORE" ;;
            # A manual or scheduled run has no base at all, and says so with the zero sha —
            # the same value GitHub sends for a ref that had no previous tip.
            # gates.mjs answers either with "nothing to diff against, so every
            # gate applies". The sentinel rather than the empty string because
            # this value travels on through job outputs and `env:` entries:
            # anything that dropped an empty value would leave GATES_BASE
            # unset downstream, and an unset variable falls back to `main`,
            # which in this checkout is the tip being tested — an empty change
            # set, every gate skipped, a green run that checked nothing. A
            # forty-character sentinel cannot be dropped by accident.
            *) BASE='0000000000000000000000000000000000000000' ;;
          esac
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          GATES_BASE="$BASE" node scripts/gates.mjs --github-output

      # With $GITHUB_OUTPUT set the script writes its lines to that file and
      # nothing to the log, so the decision would otherwise be invisible: the
      # reader would see ten grey jobs and no reason for any of them. This
      # prints every gate with its verdict, into the log and the run summary.
      - name: Say which gates run, which are skipped, and why
        env:
          # The same sentinel as above wherever the value could arrive empty,
          # so this print can never disagree with the outputs it explains.
          GATES_BASE: ${{ steps.gates.outputs.base || '0000000000000000000000000000000000000000' }}
        run: |
          set -euo pipefail
          {
            echo '### Gates for this change'
            echo ''
            echo '```text'
            node scripts/gates.mjs
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  check:
    # Job display name kept as "Lint & Type Check" so existing branch-protection
    # required-check rules continue to match. The job's scope is the fast gates
    # this change asks for: `npm run check` reads the same map as the job above
    # and runs the gates whose inputs moved, naming every one it skips (#783).
    name: Lint & Type Check
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.job_check == 'true') }}
    env:
      # The range the `changes` job settled on, so that job's outputs and this
      # job's gate selection cannot disagree about what changed. When that job
      # failed there is no output to read, and the zero sha is what says so:
      # `npm run check` then runs every gate rather than none.
      GATES_BASE: ${{ needs.changes.outputs.base || '0000000000000000000000000000000000000000' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # `npm run check` works out the change set for itself, and needs the
          # merge base with GATES_BASE to do it.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.job_check_python == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            cv-python/requirements.txt
            cv-python/requirements-dev.txt

      # The root install is this job's alone, and it is unconditional because
      # of one gate: `lint:md` needs markdownlint from here, and it is the gate
      # a prose-only change runs with no other install to its name. (The root's
      # other tool, madge, serves `lint:circular`, which is an `app` gate and
      # so never arrives without `job_check_node`.) That is also why nothing
      # reads the `job_check_docs` output: the install the docs gates need is
      # already here, and the Docker gates (`lint:links`, `lint:shell`,
      # `lint:docker`, `lint:actions`) install nothing at all. `npm ci` rather than
      # `npm install` so the transitive tree is the locked one — the whole
      # point of #490 was that a tool resolved fresh on every run is neither
      # reproducible nor immune to a registry blip.
      - name: Install root dev tooling
        run: npm ci

      - name: Install backend dependencies
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.job_check_node == 'true' }}
        run: npm ci --prefix backend

      - name: Install frontend dependencies
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.job_check_node == 'true' }}
        run: npm ci --prefix frontend

      - name: Set up cv-python venv
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.job_check_python == 'true' }}
        run: npm run setup:py:dev

      # Unchanged command: which gates it runs is the map's answer, not this
      # file's, and it prints both halves — what ran and what was skipped.
      - name: Run the fast gates this change asks for
        run: npm run check

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.job_test == 'true') }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run backend tests
        run: npx vitest run
        working-directory: backend

      - name: Run frontend tests
        run: npx vitest run
        working-directory: frontend

  python-tests:
    name: Python Tests (cv-python + GADM loader)
    runs-on: ubuntu-latest
    needs: [changes]
    # One key for both pytest lanes below: the map gives the `test:py` gate
    # two input classes — cv-python and the GADM loader's own `db-python`
    # files — because this job runs the two of them on one interpreter.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.job_python_tests == 'true') }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            cv-python/requirements.txt
            cv-python/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r cv-python/requirements.txt -r cv-python/requirements-dev.txt

      - name: pytest
        run: pytest
        working-directory: cv-python

      # The GADM loader's own lane. It needs no dependency of its own — what is
      # tested is the part of `db/init-db.py` that reads a row and nothing else
      # (#665) — so it rides on the interpreter installed above.
      - name: pytest (GADM loader)
        run: pytest
        working-directory: db

  build:
    name: Build
    runs-on: ubuntu-latest
    # `changes` for the verdict, `check` for the order. `!cancelled()` removes
    # the implicit `success()`, which is what the ordering used to rest on, so
    # `needs.check.result == 'success'` states it instead: a red — or skipped —
    # `check` keeps this job from starting, which is the behaviour that was
    # here before. A skipped `check` cannot strand a build that should have
    # run: every input that asks for a build asks for the lint gates too.
    needs: [changes, check]
    if: ${{ !cancelled() && needs.check.result == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.job_build == 'true') }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build backend
        run: npm --prefix backend run build

      - name: Build frontend
        run: npm --prefix frontend run build

      # The deterministic half of the performance gate: the entry chunk's
      # gzip size against the budget in frontend/package.json ("size-limit").
      # It runs here, on the build this job just made, so a dependency that
      # doubles the bundle fails in the same minutes the build takes rather
      # than waiting for a browser. The timing half runs in the `perf` job.
      # See docs/tech/performance.md for the numbers and the ratchet rule.
      - name: Bundle-size budget (frontend)
        run: npm --prefix frontend run size

  security:
    # Kept as "Security Scan" so existing branch-protection required-check
    # rules match. Slow Semgrep SAST only — fast audits (npm audit, pip-audit,
    # Bandit) moved into `npm run check`.
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [changes]
    # `job_security` starts the job when either scan has something to read;
    # each step then asks for itself. The Python scan is pointed at cv-python
    # alone, so a change in backend/ or frontend/ cannot alter its answer and
    # does not pay for it; the Node scan is pointed at the whole checkout, so
    # a cv-python change pays for both — running both off a single key would
    # be the same waste one level down.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.job_security == 'true') }}
    steps:
      - uses: actions/checkout@v4

      # Runs the same npm scripts as the local pre-push tier, rather than
      # restating the rulesets here, so "green locally" and "green in CI" cannot
      # drift apart. Both pin the semgrep image by digest, as scan-image.sh does
      # for Trivy.
      #
      # These replace `semgrep/semgrep-action@v1`, which is deprecated and
      # pinned semgrep 1.36.0. Registry rulesets now carry `severity: MEDIUM`,
      # which that build's `RuleSeverity` enum rejects, so it died with
      # `ValueError: invalid rule severity value: MEDIUM` while partitioning
      # rules — before reading a single file — and the action swallowed the
      # non-zero exit. This job reported success without scanning on every run
      # whose logs are still retained. See #479.
      #
      # Deliberately no `--strict`, and this is the file someone lands in when
      # they wonder why. It was tried and turned this job red at exit 3 on an
      # otherwise successful scan (266 rules then, 511 since #481 added
      # p/default; 0 findings and ~99.9% of lines parsed either way, so
      # widening the ruleset changed nothing here): four files defeat Semgrep's
      # own parser while being valid to tsc, ESLint and shellcheck, and
      # `--strict` promotes that warning into a
      # failure. Silencing it would mean excluding those files — trading a
      # warning for a real hole. It is not needed for the bug above either: the
      # `severity: MEDIUM` config exits non-zero on its own. The coverage loss
      # is recorded in docs/security/SECURITY.md under Known Gaps.
      - name: Semgrep SAST (Node)
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.job_security_node == 'true' }}
        run: npm run security:scan

      - name: Semgrep SAST (Python)
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.job_security_python == 'true' }}
        run: npm run security:py:semgrep

  trivy-image:
    name: Trivy Image Scan (cv-python)
    runs-on: ubuntu-latest
    # No longer behind `build`: this job builds the image it scans, and the
    # Node build it used to wait for is not one of its inputs. A change to
    # cv-python alone must be scanned, and that change does not ask for a
    # build at all — under the old order the scan would never have run.
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.job_trivy == 'true') }}
    steps:
      - uses: actions/checkout@v4

      - name: Build cv-python image
        run: docker build -t track-your-regions/cv-python:scan ./cv-python

      - name: Trivy scan (HIGH, CRITICAL)
        # Pinned to v0.36.0 commit SHA per GitHub Actions secure-use guidance
        # (avoid mutable @master / @v0.36.0 tag refs that can be repointed).
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: track-your-regions/cv-python:scan
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  e2e-smoke:
    # Not yet in branch-protection required checks: promote it to a required
    # check once it has proven stable across PRs. Revisit around 2026-08-09
    # (two weeks after the 2026-07-26 run this landed on).
    name: E2E Smoke
    runs-on: ubuntu-latest
    # Gated on lint+typecheck so a PR that does not compile fails in 4 min
    # with a tsc error instead of burning a full smoke run and surfacing the
    # same error buried in `docker compose build` output. Costs ~12s on the
    # green path: the critical path is already check -> build.
    needs: [changes, check]
    if: ${{ !cancelled() && needs.check.result == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.job_smoke == 'true') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # This job runs no authenticated git commands - it hands the
          # checkout straight to docker compose - so leave no token behind
          # in .git/config for the containers it starts.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Playwright itself runs inside the `e2e` service container (built from
      # frontend/Dockerfile.e2e, FROM mcr.microsoft.com/playwright:v1.58.2-jammy),
      # which ships chromium preinstalled. No `playwright install` step here:
      # this job's host process never invokes Playwright directly, so an
      # install on the runner would just burn minutes for a browser nothing
      # on the runner uses.
      #
      # No root/backend/frontend `npm ci` either: `npm run test:e2e:smoke`
      # runs scripts/test-report.mjs, which with TEST_REPORT_LOCAL unset - as
      # it is here - takes the container branch and shells out to
      # scripts/test-stack.sh. Setting the variable does not move the job to
      # the host: e2e-smoke is `containerOnly`, so the run would refuse and
      # exit 1 rather than browse a stack that was never started (#432). Every
      # service under test installs its own dependencies inside its own
      # container image (backend/Dockerfile, frontend/Dockerfile). Host
      # node_modules are never read on this path.
      # TEST_REPORT_KEEP_ENV=1 leaves the stack up for the step below, which
      # would otherwise pay for a `down -v` and a cold `up` — a Postgres
      # re-initialised from the schema, two readiness waits and a re-seed — to
      # reach a database this step has just finished with. The database lane's
      # own run tears the stack down. When this step fails, the next is skipped
      # and nothing runs that `down`; that costs nothing here, because the
      # runner is thrown away with the containers on it.
      - name: Run E2E smoke suite
        run: TEST_REPORT_KEEP_ENV=1 npm run test:e2e:smoke

      # The database-backed backend specs (#522): the ones that need a real
      # Postgres, by the criterion in docs/tech/development-guide.md § Tests
      # that need a database, and this is the one job in CI that has one. The
      # `Unit Tests` job is a bare runner with no database, which is why a
      # reachability-guarded spec in that suite would skip for ever and report
      # green. Same key shape as the two
      # Semgrep steps: the job-level `job_smoke` starts the job, `job_test_db`
      # says this step has something to read — today both key off `app`, and
      # scripts/gates.test.mjs pins that the second never holds without the first.
      - name: Run the database-backed backend specs
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.job_test_db == 'true' }}
        run: npm run test:db

      # `always()`, not `failure()`: a spec that passes on retry is flaky and
      # no longer fails the job (#447), so on a `failure()` condition the one
      # run holding the failed attempt's trace, screenshot and video would be
      # the one that threw them away. The report is small and kept for a week.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
            .test-results
          retention-days: 7

  perf:
    # Lighthouse against the production build, served inside the same
    # isolated stack the smoke lane uses, driven by that stack's pinned
    # Chromium. Budgets live in frontend/perf/lighthouse-budgets.json; the
    # numbers they were set from, and the rule for moving them, in
    # docs/tech/performance.md. Same command as `npm run perf` locally.
    name: Performance (Lighthouse)
    runs-on: ubuntu-latest
    needs: [changes, check]
    if: ${{ !cancelled() && needs.check.result == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.job_perf == 'true') }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # As for e2e-smoke: the checkout goes straight to docker compose,
          # so no token is left in .git/config for the containers to find.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No host npm ci, for the reason given on the e2e-smoke job: every
      # service under test installs its own dependencies inside its image,
      # and Lighthouse runs inside the `e2e` container.
      - name: Run Lighthouse lane
        run: npm run perf

      # Uploaded on green runs too: the reports are how a budget gets
      # re-read when it is ratcheted, and a warning-level assertion that
      # drifts is only visible here.
      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: |
            frontend/lighthouse-report
            .test-results
          retention-days: 14
