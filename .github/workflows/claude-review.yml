name: Claude PR Review

# Aligned with anthropics/claude-code-action canonical patterns:
#   docs/solutions.md > "Automatic PR Code Review"  — basic structure
#   docs/solutions.md > "Custom PR Review Checklist" — per-team criteria
#   docs/solutions.md > "Tips for All Solutions"    — REPO/PR NUMBER context, tool perms
#   docs/configuration.md > "Custom Tools"          — Bash whitelist required for gh CLI
#   docs/usage.md inputs table                       — claude_code_oauth_token for OAuth
# Auth: Pro/Max subscription via CLAUDE_CODE_OAUTH_TOKEN.
#
# When it runs (#796). A review starts four ways, and a push on its own is
# not one of them:
#   - the pull request is opened as a non-draft, or a draft is marked ready
#     (`opened` and `ready_for_review`; a PR opened ready never emits the
#     second, which is why the first stays);
#   - someone with write access comments `/review` -- one round, on a draft
#     too, since an explicit ask is an ask;
#   - someone comments `/review always`, which labels the PR
#     `review-on-push`, and from then on every push to it is reviewed
#     (`synchronize` behind the label; remove the label to unsubscribe).
# A comment-triggered run's check attaches to main's head commit, not the
# PR's (`GITHUB_SHA` on `issue_comment` is the default branch), so it never
# shows under the PR's checks; what waits for that review waits on the
# workflow run itself (`/pr-create` § 8).
# Before this, every `synchronize` ran the whole prompt, and most of what a
# push-triggered round found was a Note on a line the push had not touched --
# each one a round, because main requires every thread resolved (the
# measurement is on #796). These are the three modes Anthropic's managed
# Code Review ships (once on open or ready / every push / manual, with
# `@claude review` and `@claude review always`), what Copilot ships (once,
# with "Review new pushes" opt-in) and what the action's own repository uses
# (`opened` only). The commands that push a fix wave ask for the next round
# themselves (`/pr-create` § 8, `/commit` § 8).
#
# Trust. An `issue_comment` run carries the repository's secrets, so a
# `/review` on a fork PR runs the reviewer with the fork's tree checked out.
# The job admits a comment only from a member or collaborator
# (`author_association`), the subscribe step asks the API for the commenter's
# effective permission before it labels anything (MEMBER covers a read-only
# member too), the action then admits only a commenter with write access,
# restores `.claude/` and `CLAUDE.md` from the base branch before Claude
# starts (docs/security.md), and Bash is limited to the `gh`, `grep` and `rg`
# forms under --allowedTools.
#
# A pull request that changes this file gets no review from it: the action
# refuses to run when the workflow file differs from the default branch's copy
# ("Workflow validation failed … identical content"), and the `review` check
# still reports success while the step below prints that no execution log
# exists. The review of such a PR is the maintainer's own, and what the change
# does is seen on the first pull request after it merges.

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  # Required for Claude to read CI results on PRs (docs/security.md).
  actions: read

jobs:
  review:
    # The four ways in (see the header), and never Dependabot --
    # claude-dependabot.yml owns those (different prompt focused on
    # version-bump risk + codebase impact). Comment-based @claude
    # interactions are handled separately by claude-qa.yml (tag mode);
    # `/review` carries no @claude, so the two never both fire.
    # Action enforces "users with write access only" on every event here
    # (docs/security.md), and GitHub strips secrets for a fork's
    # `pull_request` events. The `author_association` filter on the comment
    # path is a cheaper gate in front of that one, and it is not optional:
    # the label step below runs before the action's check does, so without
    # it any account that can comment on this public repository could
    # subscribe a PR to a review on every push. The association is a
    # relationship, not a permission — a read-only member is MEMBER too — so
    # the label step asks for the effective permission before it acts, and
    # the action verifies write access again before Claude runs.
    if: |
      (github.event_name == 'pull_request'
        && github.event.pull_request.user.login != 'dependabot[bot]'
        && ((github.event.action == 'opened' && github.event.pull_request.draft == false)
            || github.event.action == 'ready_for_review'
            || (github.event.action == 'synchronize'
                && contains(github.event.pull_request.labels.*.name, 'review-on-push'))))
      || (github.event_name == 'issue_comment'
        && github.event.issue.pull_request != null
        && github.event.issue.user.login != 'dependabot[bot]'
        && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
        && startsWith(github.event.comment.body, '/review'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Action runs `git fetch origin main --depth=1` internally to restore
          # trusted base-branch config (CLAUDE.md, .claude/, etc.). Shallow OK.
          # On a `/review` comment this checks out main; the action's tag mode
          # (which `track_progress` selects for every event here) then fetches
          # and checks out the PR's head branch itself before Claude starts,
          # so no `ref:` is needed.
          fetch-depth: 1

      # `/review always`: label the PR so that `synchronize` reviews it from
      # now on. The label is (re)created on every use so the step never fails
      # on a repository that has not seen one; removing it from the PR is how
      # a subscription ends.
      - name: Subscribe the pull request to push-triggered reviews
        if: github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/review always')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          ACTOR: ${{ github.event.comment.user.login }}
        run: |
          # The job's author_association filter is a relationship, not a
          # permission: a member with read access passes it. The label is a
          # write to the PR, so ask for the effective permission first.
          perm=$(gh api "repos/$GH_REPO/collaborators/$ACTOR/permission" --jq '.permission')
          case "$perm" in
            admin|maintain|write) ;;
            *)
              echo "$ACTOR has '$perm' access here; only write access may subscribe a PR. Nothing changed."
              exit 0
              ;;
          esac
          gh label create review-on-push --force \
            --color 0E8A16 \
            --description "Every push to this pull request is reviewed (claude-review.yml)"
          gh pr edit "$PR" --add-label review-on-push
          echo "PR #$PR is subscribed: every push is reviewed until the label is removed."

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Visible progress — posts a "Claude is reviewing..." tracking
          # comment that updates with checkboxes and finalizes to "Completed".
          # See docs/solutions.md "Enhanced Example (With Progress Tracking)".
          track_progress: true

          # Default ('true') buffers any inline comment without
          # `confirmed: true` and classifies it post-session via Haiku
          # ("real review vs test/probe"). Setting 'false' makes ALL
          # inline comments post immediately, regardless of `confirmed` —
          # simpler, and removes a silent-drop failure mode for legit
          # findings. Subagent-test-comment risk is low for this
          # review-only flow.
          # See docs/usage.md inputs table for `classify_inline_comments`.
          classify_inline_comments: false

          # Self-contained prompt — no external doc references that would
          # cost turns to read. Project conventions (CLAUDE.md, etc.) are
          # auto-loaded into Claude Code's system context by the action.
          #
          # Output rules below are mandatory, and they decide the channel: a
          # Critical or Major finding this PR introduced, on a line it changed,
          # goes inline through the MCP tool, where it is a thread the author
          # must resolve; everything else — Minor, Note, `[pre-existing]` of
          # any severity — is a line in the one summary comment `gh pr comment`
          # posts, which blocks nothing (#796). Per docs/capabilities-and-
          # limitations.md the action itself updates only its tracking
          # comment; the summary is a second comment, posted by the CLI.
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
            TRIGGER: ${{ github.event_name }} ${{ github.event.action }}

            You are reviewing this PR. Project conventions live in CLAUDE.md
            (already in your context). The structure below mirrors
            anthropics/claude-code-security-review's prompt design — phased
            methodology, generic categories, confidence-based publish bar.

            TRIGGER says how this review was asked for. `pull_request opened`
            or `pull_request ready_for_review` is the first review of this
            PR. `issue_comment` (someone commented `/review`) or
            `pull_request synchronize` (a PR subscribed to push-triggered
            reviews) is a re-review, and the OUTPUT RULES say what changes
            then. Whichever it is, the review covers the whole diff against
            main, not the last push: a push alone never starts a review
            here, so what you see may be several waves of work.

            ## CRITICAL INSTRUCTIONS

            1. **Find first, filter second — separate steps.** While
               analysing, note EVERY candidate with a severity and a
               confidence, including ones you suspect are weak. Do not
               suppress candidates while you are still looking. Only once
               analysis is complete, apply the publish bar: post a finding
               if you can name the specific control-flow path that's
               broken, the specific contract that's violated, or the
               specific other file that now contradicts this change. Drop
               the rest silently, without narrating what you dropped. A bar
               applied during discovery costs you real findings; the same
               bar applied at publish time costs you nothing.
            2. **Avoid noise.** Skip stylistic preferences, defensive-code
               wishes where internal guarantees exist, reformatting wishes.
            3. **Verify before flagging.** When tempted to flag "X is
               missing", check upstream (middleware, wrappers, project
               conventions in CLAUDE.md / dev-guide) and downstream (is the
               supposed gap actually reachable?). If verification shows it's
               handled elsewhere — Zod `validate()` at the route layer,
               `requireAuth` middleware, generic error handler — DON'T flag.
               False positives waste reviewer attention.
            4. **Pre-existing ≠ skip, and pre-existing ≠ inline.** Latent
               bugs in moved/refactored code STILL get reported, with a
               `[pre-existing]` prefix — refactoring is the natural moment
               to surface latent issues — but in the summary comment,
               never as an inline thread, whatever their severity. An
               inline thread is a blocking ask of this branch (branch
               protection on main requires every thread resolved), and a
               defect the branch did not introduce is not the branch's
               ask. Naming it in the summary lets the author fix it here,
               file it, or leave it, without a round.
            5. **Calibrate severity.** Critical / Major / Minor / Note based
               on blast radius, exploitability, recoverability — NOT on
               visual prominence.
            6. **Suppression hygiene.** Treat every NEW linter suppression
               this PR adds as a red flag and verify it against
               `docs/tech/development-guide.md` § Linter Suppressions.
               This applies to ALL linter syntaxes:
                 - JS/TS: `eslint-disable*`, `@ts-ignore`, `@ts-expect-error`,
                   `nosemgrep`
                 - Python: `# noqa: <CODE>` (Ruff), `# type: ignore[<CODE>]`
                   (mypy), `# nosec <CODE>` (Bandit)
                 - Cross-language: `lgtm[<rule>]` (CodeQL)
                 - Shell: `# shellcheck disable=<SCnnnn>` /
                   `# shellcheck source=<path>`
               Same mechanical rules apply to every syntax above:
                 a. **Mechanical** — must be inline (no file-level or
                    block-level `/* eslint-disable rule */ ... /* eslint-enable */`),
                    must name the rule explicitly, and must end with
                    `-- <reason>` explaining what makes the spot safe.
                    Any violation of these → flag as Major.
                    **shellcheck is the exception, in syntax only.** Its
                    directives take no trailing `-- reason` — appending one
                    is a parse error (SC1072) — so the reason goes on its own
                    comment line immediately above, and that line must not
                    begin with the tool's name (SC1073). The `source=<path>`
                    form names no code, because it points at a file rather
                    than switching a check off; there, require the reason
                    alone. Judge these by the guide, not by the `-- reason`
                    shape above.
                 b. **Substantive (the harder question)** — ask whether
                    the suppression is silencing a real issue the PR
                    introduced. If the warning could have been fixed by
                    changing the code (renaming a variable, restructuring
                    logic, narrowing types, validating input), the fix
                    belongs in the code — not in a disable comment. Flag
                    any suppression that looks like "added to make CI
                    green" rather than "this is genuinely safe and the
                    linter is wrong here" as Major. Trust the linter's
                    intent unless the `-- reason` clearly explains why
                    the rule is wrong in this specific spot.
                 c. **Pre-existing suppressions** that the PR moves or
                    edits (without changing intent) are NOT flagged — only
                    *newly added* suppressions and substantive *changes*
                    to existing reasons get this treatment.

            ## ANALYSIS METHODOLOGY (phases)

            **Phase 1 — Context.** Read CLAUDE.md and any relevant
            `docs/tech/*` doc for the area touched by this PR. Note the
            project's patterns and conventions for this domain.

            **Phase 2 — Diff.** Get the diff with `gh pr diff <PR NUMBER>`. Identify
            what changed: pure move vs new behavior vs deletion. For each
            hunk also name the *claim* it changes — a rule, a threshold, a
            command, a flag, a signature, a schema field, a documented
            behaviour. Phase 4 checks those claims against the rest of the
            repo.

            **Phase 3 — Trace.** For each non-trivial change, MENTALLY
            EXECUTE the code paths — happy path, early returns, error
            paths, edge conditions. Don't assume a familiar pattern
            (try/finally, async/await, transactions, locks) is implemented
            correctly because the shape is correct. Each control-flow exit
            must satisfy the required contract (commit/rollback, release,
            close, unlock, cleanup). Verify, don't pattern-match.

            **Phase 4 — Ripple.** The diff is not the blast radius. For
            each claim from Phase 2, `Grep` the repo for OTHER places that
            state the same claim, and check they still agree. A PR that
            changes a rule in one file and leaves the contradicting
            statement standing in another is a defect even though the
            second file never appears in the diff — that file is now
            wrong, and nothing else will catch it. This phase is not
            optional and cannot be done from the diff alone: if you have
            not run a search this phase did not happen.

            Places this repo states the same thing twice — check the ones
            the diff actually touches, not all of them. Each pair is a
            guard for a rule that has no single home yet: the slice of
            #788 that gives it one deletes the pair from this list in the
            same pull request, and a pair whose home has landed is a stale
            line here, not a check.
              - `CLAUDE.md` ⇄ `docs/tech/development-guide.md` — both
                state process rules (commit format, pre-commit gates,
                file-size limits, refactoring hygiene) [no slice yet]
              - `CLAUDE.md` command table ⇄ `package.json` scripts
                [no slice yet]
              - any user-visible change ⇄ `docs/vision/vision.md`
                [no slice: a product document is written by hand]
              - auth / endpoint / role / input-surface changes ⇄
                `docs/security/SECURITY.md` and
                `docs/security/asvs-checklist.yaml` [no slice yet]
              - architectural choices ⇄ accepted ADRs in `docs/decisions/`
                [no slice: an ADR is a record]
              - backend response shape ⇄ its frontend consumer
                [retired by #527]
              - `.env.example` ⇄ `docker-compose.yml` ⇄ any doc naming
                the variable [no slice yet]
              - `db/init/*.sql` ⇄ Drizzle schema ⇄ the domain model
                described in CLAUDE.md [retired by #792]

            A Major or Critical ripple finding is anchored on the line the
            PR *changed* (an inline comment must land on a line that exists
            in the diff) and names the other `file:line` that now
            disagrees. A lesser one is a summary line and names the other
            file directly — it needs no anchor.

            **Phase 5 — Verify.** For each candidate finding, run the
            CRITICAL INSTRUCTION #3 check (upstream/downstream) before
            posting. Drop verified-handled candidates.

            ## CATEGORIES (general — not exhaustive, not bug-specific)

            - **Security** — OWASP ASVS 5.0 L2: input handling at trust
              boundaries, authn/authz on endpoints, parameterized queries,
              secret handling, access control (IDOR), injection vectors
            - **Correctness** — logic errors, missing edge cases, control-flow
              exits that skip required cleanup, error-path correctness,
              concurrent state handling
            - **Refactoring hygiene** — dead code left behind, unused imports,
              redundant guards, leftover commented code
            - **Suppression hygiene** — new linter suppressions added by this
              PR (see CRITICAL INSTRUCTION #6). Two failure modes: mechanical
              (file-level disable, missing `-- reason`, missing rule name) and
              substantive (suppression masks a real fixable issue rather than
              a genuine linter false positive). The latter is the more common
              and more dangerous failure mode — verify each new suppression's
              reason actually justifies the suppression.
            - **Cross-file consistency** — a rule, command, constant, env
              var, schema, or documented behaviour changed in one file
              while another file still states the old version (Phase 4).
              Docs count: a stale rule in CLAUDE.md is as real a defect as
              a stale constant in code, because both are read as truth.
              A stale count, tally, line pointer or history sentence in
              prose or a comment is a Note, and the fix it names is to
              drop the volatile claim — state the class, name the symbols
              (#579) — not to refresh the number, which will be stale
              again after the next change. It goes inline only when the
              stale sentence states a rule that is now false and the blast
              radius makes it Major.
            - **Convention adherence** — code reuse (shared components/utils),
              file-size limits, dev-guide patterns, commit hygiene

            ## EXCLUSIONS (don't report)

            - Style preferences without correctness impact
            - "Could be more readable" without naming a specific contract
              violated
            - Defensive code suggestions where internal guarantees exist
            - Theoretical issues with no plausible exploitation/failure path

            ## OUTPUT RULES (mandatory)

            Two channels, and a finding's severity and provenance decide
            which one it goes to.

            **Inline thread** — `mcp__github_inline_comment__create_inline_comment`
            with the exact `path` and `line` of the issue and one or two
            sentences naming the issue and the fix. ONLY for a finding that
            is **Critical or Major**, **introduced by this PR** (no
            `[pre-existing]`), and anchored on a **line the diff changed**.
            Every thread costs the author a round — branch protection on
            main requires it resolved before the merge — so open one only
            for what must change before this branch merges.

            **Summary comment** — ONE top-level comment via `gh pr comment`,
            posted after the inline threads:
              1. A 1–2 sentence verdict with a tally, e.g. "2 blocking
                 findings inline; 3 notes below." or "Clean."
              2. The head SHA you recorded at step 1 of the Workflow, on
                 its own line: `Reviewed <sha>` — that SHA, not a fresh
                 read, so a push that lands mid-review is never named as
                 reviewed. The next re-review reads it.
              3. **Notes** — every Minor and Note finding, and every
                 `[pre-existing]` finding of any severity, one line each:
                 - **Minor** `path:line` — the issue; the fix
                 Ordered Critical first. These are information for the
                 author, not asks: nothing here blocks the merge.
              4. Never repeat the inline findings in the summary — that
                 defeats the inline channel.
            No findings at all → the verdict and the SHA alone.

            **Re-review convergence.** A re-review is any run on a PR that
            already carries a claude[bot] summary. Threads follow the rule
            above, with one more condition: a finding that already has a
            claude[bot] thread, open or resolved, is never threaded again —
            it is judged in that thread. Notes only on lines changed since
            the SHA the last summary names
            (`gh api repos/<REPO>/compare/<sha>...<head>`, or the diff of
            that range in the checkout); an earlier note that still stands
            is not repeated — the earlier summary holds it. Existing
            UNRESOLVED claude[bot] inline threads are resolved (GraphQL
            `resolveReviewThread`; own threads only — never CodeQL's,
            CodeRabbit's or a human's) in two cases: the concern is gone
            from the diff, or the author's reply gives a reason you accept
            — a reasoned decline closes a thread the way a fix does. A
            thread whose concern still stands and whose reply does not
            persuade stays open, with your answer to the reply in it. The
            verdict says how many were resolved, e.g. "Resolved 3 prior
            findings; no new blocking issues."

            Workflow:
            1. Record the head you are reviewing before you read anything:
               `gh pr view <PR NUMBER> --json headRefOid`. That SHA is what
               the summary's `Reviewed <sha>` names. Then get the diff:
               `gh pr diff <PR NUMBER>` (by number: on a `/review` run the
               checkout began on main)
            2. Run the Phase 4 repo search for every claim the diff changes
            3. For each Critical or Major finding this PR introduced, on a
               line the diff changed → inline thread
            4. Once all inline threads are posted → ONE summary via
               `gh pr comment`: verdict, `Reviewed <sha>`, the notes
            5. On a re-review (TRIGGER is `issue_comment` or
               `pull_request synchronize`, or the PR already carries a
               claude[bot] summary): read the last summary's SHA (the
               newest claude[bot] comment with a `Reviewed` line in
               `gh api repos/<REPO>/issues/<PR NUMBER>/comments`), confine
               the notes to what changed since it, open no second thread
               on a finding that already has one, resolve your own threads
               that are addressed or reasonably declined (`gh api graphql`
               with the `reviewThreads` query and each thread's replies,
               then `resolveReviewThread`), and count them in the verdict
               — the convergence rule above

            Other rules:
            - Only post GitHub comments — don't submit review text as chat messages.
            - Be terse. Actionable findings only, no narration of what the PR does.

          # Grep/Glob/Read come from the action's own base tool set; the
          # grep/rg shell entries mirror claude-qa.yml + claude-dependabot.yml
          # so the Phase 4 repo search has a path either way. `gh api repos`
          # closes the one concrete asymmetry with claude-qa.yml, which has it.
          #
          # --max-turns is headroom, not a fix: across seven review rounds on
          # PR #430 the reported num_turns ran 29-59 against a cap of 50 and
          # every run still ended `subtype: success`, so the two do not count
          # the same unit. 80 was chosen to keep a genuinely large PR off the
          # limit, and on 2026-09-10 one reached it: PR #860's ninth round
          # reported a *successful* result after 89 turns and the action failed
          # the job anyway -- `Claude reported a successful result after 89
          # turns, exceeding the configured maximum of 80`. The review had run
          # to the end and posted its findings; the cap turned a finished review
          # into a red check on a branch with nothing wrong. So the number is
          # raised on the evidence rather than on a guess, and the sentence that
          # said the cap "was never observed to bite" is retired: it has.
          claude_args: |
            --model claude-opus-5
            --effort xhigh
            --max-turns 140
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api graphql:*),Bash(gh api repos:*),Bash(grep:*),Bash(rg:*)"

      # Every review round on PR #430 reported 1-6 permission_denials_count
      # with no way to tell which tool was refused: the action prints only the
      # count, and the detail lives in an execution log it does not surface.
      # This lists the tools the run actually reached for, so the allowlist can
      # be tuned against evidence instead of guesswork — anything here that is
      # absent from --allowedTools above is a denial.
      #
      # Names only, never the transcript: this repo is public, and the log
      # holds full tool results including file contents the review read.
      - name: List tools the review reached for
        if: always()
        run: |
          log="${RUNNER_TEMP}/claude-execution-output.json"
          if [ ! -f "$log" ]; then
            echo "No execution log at $log — the action skipped or died early."
            exit 0
          fi
          # The result record carries a `permission_denials` array alongside the
          # count the action already prints, with the tool and the exact input
          # that was refused. That is the direct answer when it is present.
          echo "Denied tool calls:"
          jq -r '[.. | objects | select(has("permission_denials")) | .permission_denials[]?]
                 | if length == 0 then "  (none recorded under permission_denials)"
                   else (.[] | "  \(.tool_name): \(.tool_input | tostring | .[0:200])") end' \
            "$log" 2>/dev/null || echo "  (could not parse the log)"
          echo
          # Fallback, and a cross-check: anything listed here that is absent
          # from --allowedTools was refused, whatever the log's own shape.
          # Recursive descent keeps both queries shape-agnostic, so an upstream
          # change to the envelope fails loudly rather than printing nothing.
          echo "Tools attempted this run:"
          jq -r '[.. | objects | select(.type? == "tool_use") | .name] | unique[]?' \
            "$log" | sed 's/^/  /' || echo "  (could not parse the log)"
