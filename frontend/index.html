<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Track Your Regions</title>

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0d9488" />

    <!-- Fonts: served from this origin, declared in src/fonts.css. The two
         Latin faces the first paint draws are fetched before the stylesheet
         asks for them; a font preload needs crossorigin even same-origin. -->
    <link rel="preload" href="/fonts/figtree-v9-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/syne-v24-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Map styles ship with the maplibre-gl package and are imported in main.tsx -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
