      desc: "Input validation is enforced at a trusted service layer; client-side validation is not relied on as a security control"
      level: 1
      status: pass
      notes: "Established by V2.2.1's notes: every route's input is parsed by its Zod schemas on the backend, and cv-python's by FastAPI's declarations and decode_image(), so no check rests on the web client's own validation. Recorded from those notes on 2026-11-15 (#2524), not re-audited against the code."
