    V2.4.1:
      desc: "Anti-automation controls protect against excessive calls to application functions (data exfiltration, garbage data, quota exhaustion, rate-limit breaches, denial of service, overuse of costly resources)"
      level: 2
      status: pass
      notes: "express-rate-limit on login (10/15min), register (5/hour), refresh (30/min). Fixed 2026-02-10. Merged from the row filed as V4.1.2 until 2026-11-15 (#2524): express-rate-limit on auth (login, register, refresh), geocode search (30/min, curator-only), and experience search (30/min). Fixed 2026-02-10. Admin routes are otherwise unlimited by design — bulk workflows (batch match acceptance, geometry compute) legitimately issue many requests a minute — with the named exceptions below (no count: this note has twice been left one short by a route being added to it). (1) POST /wv-import/matches/:id/rematch carries expensiveAdminLimiter (5/min), because it deletes every region_members row for a world view and then spends 20-130s re-resolving them, so a repeat request costs more than the request and each run destroys the previous one output. The 409 guard stops concurrent runs but not rapid succession. Added 2026-07-30 (#456). (2) POST /experiences/:id/publish carries authenticatedLimiter (60/min) — the first route limited under requireCurator rather than requireAdmin, and deliberately a different limiter. It qualifies on the same criterion: where a publication releases a deferred withdrawal (ADR-0025) it re-places the object into every world view with geometry after committing, which is expensive regardless of who sends it. 60/min rather than 5/min because that branch fires only for a point that moved, an ordinary publish is one transaction, and a curator answers a queue in batches — the first gated round is about 18 arrivals, so 5/min would 429 mid-work to bound a branch most publishes never reach. (3) POST /experiences/:id/admission carries the same authenticatedLimiter (60/min), because it reaches the same post-commit placement rather than a similar one: overriding a refusal on a gated arrival publishes its contents through the shared publishContents, so it can release a deferred withdrawal, and setExperienceAdmission then calls placeAfterAdmissionRelease -> placeAfterRelease after releasing its client. The criterion decides per branch, not per endpoint. The curator routes that remain exempt (/:id/state, /:id/decline-source, /:id/works/:treasureId/edit, /review/queue) are verified rather than assumed: each ends at res.json with nothing after its client.release(). /:id/accept-source was among them until it grew post-commit placement — see (7) — which is the second route to leave this list that way, so the list is re-read against the handlers rather than carried forward. /:id/decline-source (2026-08-14) is the plainest — it writes one row per refused field and does not touch the experience, since the value it refuses had already won every run — and CodeQL flags it like the rest, dismissed against this note. PATCH /:id/works/:treasureId/edit (2026-08-31, #720, ADR-0040) joined it on the same check and is the one worth reading against its own sibling: PATCH /locations/:locationId/edit is limited under (6) because a corrected coordinate always re-places the object, and a work has no coordinate at all - one locked object, one locked row, one audit row, nothing after the commit. Resemblance to a limited route is not the criterion; reaching placeAfterRelease is. Its CodeQL alert is dismissed against this note like the rest. /:id/decline-held left that list on 2026-10-04 (ADR-0083, #1233) and carries authenticatedLimiter (60/min): refusing an object's held coordinate turns down the unread point that is the same move, and a refused point is re-placed through placeAfterRelease after the client is released, whenever movedPointRefused is set. Its two CodeQL alerts are dismissed against this note. (4) POST /api/experiences/sources/:sourceId/publish-waiting carries authenticatedLimiter (60/min) as well, and is the clearest case of the criterion: it runs the publish transaction once per waiting object and can reach the post-commit region placement on any of them, so its cost scales with the source's backlog rather than with the request. (5) POST /api/experiences/locations/:locationId/state carries authenticatedLimiter (60/min) on the same criterion, decided per branch as always: an answer that leaves the point where it was is one locked row and one update, but an answer that changes what a reader sees re-places the point in either direction — a withdrawn point holds no auto region rows, because the run that marked it re-placed the experience and placement takes offered points only (measured: 0 rows against the offered point's 3), so revealing one must place it and hiding one must stop it counting toward a region. Either way it calls placeAfterRelease after committing, the same post-commit placement /:id/publish is limited for. Added 2026-08-15 (ADR-0026, #541). (6) PATCH /api/experiences/locations/:locationId/edit carries authenticatedLimiter (60/min) on the same criterion and without a branch to decide: a correction to a coordinate always calls placeAfterRelease after committing, since a point in a new place may fall in a different region, so unlike its sibling /:id/state there is no answer here that costs one locked row. A rename is the one shape that places nothing and it is not worth a second limiter. Added 2026-08-20 (ADR-0029). (7) POST /api/experiences/:id/accept-source carries authenticatedLimiter (60/min) as of 2026-08-21, having been on the verified-exempt list until then: accepting the object's coordinate now releases the claim on the point that carried it and puts that point back on the coordinate the run offered, so a place moves and placeAfterRelease runs after the client is released, exactly as it does for (6). Decided per branch as always - the five writable fields place nothing - and the limiter sits on the route because a route is what a limiter attaches to (ADR-0029). CodeQL js/missing-rate-limiting fires on every route this section exempts, on either router - the curator ones in experienceRoutes.ts and the admin gate switch PUT /api/admin/sync/sources/:sourceId/curation-gate in adminDeclaredRoutes.ts, which stays exempt because it updates one row of the source table and changes only what future runs do - and each such alert is dismissed against this note. Its sibling PUT /api/admin/sync/sources/:sourceId/line (2026-09-08, ADR-0052, #753) joined it on the same check: the body is Zod-bounded (four integers 1..1000, the finds pair optional and taken both-or-neither, each stay line refused above its enter line - #581) before it reaches a query, the write is one read to decide 404 from 409 followed by one UPDATE of the same row, and nothing follows the commit - a source's fame line, like the gate beside it, changes only what a future run does. (8) GET /api/admin/data-assertions carries expensiveAdminLimiter (5/min) and POST /api/admin/data-assertions/accept carries authenticatedLimiter (60/min), and the split is the criterion applied twice rather than a compromise: the report runs a statement per assertion over the whole catalogue (~11s as of 2026-08-27; no count of them is written here for the same reason as above), which is expensive regardless of who sends it, while an acceptance re-runs one of those statements and inserts one row. Since #685 one of those statements takes eight seconds on its own - the rung rule reads a full-resolution geometry column - so the order the two buckets were in has inverted: 60 acceptances a minute is up to eight minutes of database work per minute from one address, against five scans of about eleven seconds. What carries the split was never the ratio but what each is a ceiling on - the report is a whole scan any caller can repeat at will, an acceptance is a person answering for one rule and runs out of rules to answer for, a second press of the same one recording the same number. The bucket matters because the state that screen exists for is a database where nobody has answered for anything - a press per invariant - and every limiter here is keyed by IP, so five a minute is five for the whole address an admin works from and would refuse them halfway through their first pass. Added 2026-08-24 (ADR-0032). (9) POST /api/admin/sync/sources/:sourceId/fix-images carries expensiveAdminLimiter (5/min): a picture repair is a run over every row of a source - Wikidata, then Commons, then a write per row - and since #557 the route reads the source and the run table before it starts, which is the database access CodeQL's js/missing-rate-limiting fired on; a press while a run is in flight is answered 409 before anything starts. Added 2026-09-02 (ADR-0043). No count is written here because a count above a list is what goes stale when a route joins it. (10) PUT and DELETE /api/experiences/review/set-aside/:syncLogId carry authenticatedLimiter (60/min) as of 2026-09-07 (ADR-0051 decision 4, #805). Neither reaches the post-commit placement this criterion turns on: setting a run's batch aside is one insert with ON CONFLICT DO NOTHING, bringing it back is one delete of the caller's own row, and nothing follows the commit in either. They carry the limiter as ordinary authenticated curator actions - a chip a curator can toggle, one small write per press - which is what puts them in the 60-a-minute bucket rather than expensiveAdminLimiter's five. GET /api/experiences/review/queue stays on the verified-exempt list under its new shape, re-read against the handler rather than carried forward: since #805 it is one keys statement over the union of the seven kinds, one hydrating statement per kind the page actually holds, and the three answered lists (keptOut, answeredWithdrawals and, since #859, refusedParts) that sit outside the union and run on every request, measured on the development catalogue of 2026-09-07 at 123 ms for the keys statement and 296 ms cold end to end, against about 590 ms for the nine statements it replaced - cheaper than what it was exempt as, and still ending at res.json with nothing after it. GET /api/experiences/review/queue/map (#2477, 2026-11-13) joins it on the same check: one statement over the same union under the same chips, unpaged, writing nothing, with nothing after the read; the union it reads held 15,709 open questions on the development catalogue of 2026-11-13 and was read in 1.0 s, the same union the queue's facets count on every request. The third list costs 0.5 ms on a catalogue holding no refused part, because its objects are named by a MATERIALIZED gate before its laterals run; ungated it was ~100 ms, which is the shape this enumeration exists to keep honest. Added 2026-08-12 (ADR-0025). (11) POST /api/experiences/review/answer carries authenticatedLimiter (60/min) as of 2026-09-09 (#852, ADR-0053), on the criterion with publish-waiting's force: it answers up to a page of review rows (the queue's own maximum of 100, Zod-bounded) each through the writer its single-row card calls, one transaction and one audit row per object, and five of those writers reach the post-commit placement - a publish or an overriding admission verdict can release a deferred withdrawal, an accepted source coordinate moves a pin, a verdict on a withdrawn row re-places the object once per point, and a rejected row holding an unread point re-places the object, since a turned-down point counts toward no region any more. Scope is resolved per object, so a region-scoped curator's batch reports what it left alone rather than touching it. The two single-row refusals beside it (ADR-0053) part on the same check. POST /:id/refuse-arrival joins the verified-exempt list: one membership row inside one transaction, touching nothing a reader sees (the row was hidden already), ending at res.json with nothing after its client.release(); its CodeQL alerts are dismissed against this note like the rest. POST /:id/refuse-contents carries authenticatedLimiter (60/min) for the branch /:id/publish is limited for: a refused point counts toward no region any more (placement's insert carries refused_at IS NULL, ADR-0053) - so the object is re-placed into every world view with geometry after the commit, through the same placeAfterRelease. (12) POST /api/experiences/:id/unrefuse-contents carries authenticatedLimiter (60/min) as of 2026-09-10 (#859), on the same branch read backwards: asking again about a turned-down point clears the mark placement's insert filters on, so the point counts toward its regions once more and the object is re-placed after the commit through the same placeAfterRelease. It writes nothing else - one locked object, one UPDATE per kind, one audit row - and its body is the refusal's own Zod schema, bounded at 2000 ids per kind. (13) POST /api/admin/sync/sources/:sourceId/find-component-items carries expensiveAdminLimiter (5/min) as of 2026-10-09 (#1272), on the same criterion as (9): it takes no body, only an optional Zod-bounded ?experienceId= naming one site (#1429), and like the picture repair it reads the source and the run table before it starts (and, for one site, that site's experiences and source_records rows, a 404 for an id no site of the source has), then runs a search over every World Heritage component that no Wikidata item records, or over one site's: statements over the local Wikidata subset, one of them a read of every coordinate it holds (#1435), and requests to Wikidata's API for the candidates' labels, paced by the shared client (#1307), far fewer for one site. It writes only proposals for a curator. A press while a run is in flight gets 409 before anything starts. (14) POST /wv-import/matches/:id/rematch/cancel carries the re-match's expensiveAdminLimiter (5/min) as of 2026-10-18 (#1613), as the issue asked: it takes no body, only the Zod-bounded world view id, and sets the running re-match's in-memory cancel flag. One limiter instance is one bucket, so the stop shares its five a minute with the re-match, the dump builds and the other routes on it; a refused stop is shown on the review panel rather than swallowed. (15) GET /api/geocode/reverse and GET /api/geocode/article-point/:id carry authenticatedLimiter (60/min) as of 2026-11-02 (#2206), curator-only like the search: a point dialog asks the first once per pin, which the search's 30/min would refuse within a few dialogs, while Nominatim's one request a second is held by the queue in services/nominatim.ts that both reverse lookups and searches wait in; the second reads one row and asks the place's own Wikipedia article for its coordinate, with no URL from the request. See docs/tech/rate-limiting.md section 5 for the named-exception table. The world map's hover-card picture read (GET /experiences/:id/picture, public) carries pictureHoverLimiter (120/min per IP), a budget of its own so resting the pointer on pins cannot spend the publicReadLimiter reads the region lists share (#927)."
    business_logic_server_side:
      desc: "Business logic flows (sync, curation, region management) run server-side (project-specific check, not an ASVS 5.0 requirement id)"
      level: 1
      status: pass
      notes: "Sync operations, curation, region management all server-side. Kept under a descriptive key since 2026-11-15 (#2524): it was filed as V2.3.1, whose ASVS 5.0 requirement asks that a user's business logic flows run only in the expected step order without skipping steps, which this entry does not check; V2.3.1 has its own row."

