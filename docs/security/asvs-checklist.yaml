  V8_authorization:
    V8.1.1:
      desc: "Authorization documentation defines rules restricting function-level and data-specific access by consumer permissions and resource attributes"
      level: 1
      status: not-checked
      notes: "Not yet audited against the code under ASVS 5.0 (added 2026-11-15, #2524)."
    V8.1.1_cvpy:
      desc: "cv-python service: authorization documentation defines rules restricting function-level and data-specific access by consumer permissions and resource attributes"
      level: 1
      status: pass
      notes: "Service has no per-request authn/authz. Trust derives from Docker network isolation: no `ports:` mapping in docker-compose.yml (only `expose: 8000`), service reachable only at http://cv-python:8000 from other containers on the bridge. Documented as a trust boundary in SECURITY.md. If cv-python ever moves out of the bridge or onto a shared cluster, a shared-secret header or mTLS becomes mandatory — tracked as a follow-up. Verified 2026-05-10."
    V8.1.2:
      desc: "Authorization documentation defines field-level read and write access rules by consumer permissions and resource attributes"
      level: 2
      status: not-checked
      notes: "Not yet audited against the code under ASVS 5.0 (added 2026-11-15, #2524)."
    V8.2.1:
      desc: "Function-level access is restricted to consumers with explicit permissions"
      level: 1
      status: pass
      notes: "All admin endpoints use requireAdmin. SSE geometry compute endpoint fixed to include requireAdmin. Fixed 2026-02-10. World view visibility is checked server-side too, via two mechanisms: a declared route's scope (ADR-0071), checked by isVisibleToReaders in backend/src/middleware/worldViewVisibility.ts, guards the region/experience read surface (404, not 403) and getWorldViews filters the listing; GET /api/experiences/:id can't use either, since the experience itself is public, so it filters the regions[] it returns with the same predicate instead — and separately does 404 for an unread row from a gated source, which is not public (ADR-0025). See V8.2.2 for detail."
    V8.2.2:
      desc: "Data-specific access is restricted to consumers with explicit permissions to the specific data items (IDOR, BOLA)"
      level: 1
      status: pass
      notes: "All user-scoped queries use /me/ pattern with req.user.id. No URL-based user ID accepted for personal data. World view visibility is enforced by two mechanisms, shaped by what each route can answer. (1) a declared route's scope (ADR-0071) guards region reads, experience-by-region reads, and the region-scoped experience locations reads (regionId as a route param or a query param); it answers 404 rather than 403, so existence is not confirmed. (2) GET /api/experiences/:id (getExperience) can't 404 on *world-view* visibility — the experience itself is public data, only its world-view association is sensitive — so it instead filters the regions[] array it returns, using the same is_active/is_public predicate as getWorldViews. That sentence stopped being the whole story with ADR-0025: the same route now does 404 on a different axis, because an unread row from a gated source (curation_state = 'pending') is not public data at all — no read has ever shown it — so /:id, /:id/locations and /:id/treasures answer 404/empty for it and widen only for a curator or admin whose scope reaches the experience (maySeeUnreadExperience). Two axes, two different answers, and the reason they differ is what each hides: a hidden world view is a fact about our organisation of public objects, an unread row is an object nobody has vouched for. POST /experiences/:id/publish is the one route that accepts caller-supplied child ids (locationIds, treasureIds); both arrays are re-scoped inside the statements that consume them, so an id belonging to another experience is discarded rather than trusted — see SECURITY.md. Added 2026-08-12 (ADR-0025). The regions[] array gained a second filter on that same second axis on 2026-08-24 (#521): a region is named only where the object has a point there that this caller may see, so an assignment a gated run made on an unread point no longer discloses the region it landed in — placement writes such a point into experience_regions deliberately (ADR-0025 decision 5), and every reader-facing region read now asks readerRegionMembershipSql() rather than reading that roll-up bare. It is relaxed on the same maySeeUnreadExperience boolean as the row itself, for the reason /:id/locations is: a curator reading a queue item has to be shown where publishing will put it. A manual assignment is exempt, having been made by a curator rather than derived from a point. GET /:id/treasures names the museums each work hangs in (venues) behind the same boolean and to no reader: every venue, a refused, unread or out-of-scope one included, by name, kind, source id and whether readers see the work there - intended, since the curator's correction writes the row all of them carry and the dialog must say which they are. Merged from the row filed as V8.3.2 until 2026-11-15 (#2524): checkCuratorScope() validates global/source/region scopes with recursive CTE — those three are what curator_assignments.scope_type permits in db/init/01-schema.sql since migration 055 (#819, 2026-09-13): the scope that names a source is spelled 'source', the word db/migrations/001-curator-system.sql created it with. In between, 01-schema.sql spelled it 'category' and no migration converted a 001-provisioned database, so such a database could hold 'source' rows that granted nothing (the matchers said 'category'). 055 converts every 'category' row to 'source', re-creates both CHECK constraints and the partial unique index under that word and renames category_id to source_id, so a 'source' assignment now grants exactly the scope it names — the intended one (#452, closed by #819) — and CuratorScopeType matches the schema. Older sentences below that say category, e.category_id or /experiences/categories/:categoryId/publish-waiting describe the same code under its earlier names: it is source, e.source_id and /experiences/sources/:sourceId/publish-waiting now. getCurationLog's check was added 2026-02-10 but qualified one arbitrary region of the experience while the response carried rows for all of them (#442); it now resolves scope against everything in the log attributable to the caller — the experience's assigned regions and the regions its log rows already name — and filters the rows themselves through CURATOR_SCOPED_REGIONS_CTE, so a region-scoped curator sees only the entries for regions they cover. Fixed 2026-07-29. Since #1366 (2026-10-12) the log it reads is the place's and that of every entry a standing merge folded into it (LOG_PLACES_CTE), under the same gate and the same per-row filter. editExperience carried the same one-arbitrary-region shape on the write path (#450): an unordered LIMIT 1 over experience_regions both decided the 403 — refusing a curator who was in scope whenever it returned another of the experience's regions — and landed on the audit row, which since the log change above hid the edit from its own author. It now intersects the experience's assignments with CURATOR_SCOPED_REGIONS_CTE for the grant, and names on the log row a region the caller covers (NULL for admins, global curators, and curators of the category, whose authority came from no one region). The other curation handlers are told their region by the request, so none of them shares the shape. Fixed 2026-07-29. The review queue (GET /experiences/review/queue, POST /experiences/:id/state, POST /experiences/:id/accept-source, added 2026-08-03) runs on the same predicate: the two write endpoints reuse resolveExperienceScope, and the queue — the first set-returning caller — qualifies rows with CURATOR_SCOPED_REGIONS_CTE. POST /experiences/:id/admission joins them unchanged (ADR-0024, 2026-08-08): resolveExperienceScope for the grant, and the queue's fourth set — keptOut, the refusals a curator confirmed — carries the same CTE, so a region-scoped curator can only take back a withdrawal they could have made. That set exists because the withdrawal is otherwise irreversible: experienceOfferedToReaderSql rides on no reader toggle, so a confirmed row is reachable on no other surface, and override therefore stays permitted on a pinned row while confirm does not — the asymmetry is the audit-relevant part, since only confirm hides. Its rows span categories, so it correlates the unrestricted check on e.category_id rather than on the caller's optional categoryId filter; binding $3 there would have measured every row against one request parameter and silently stripped a category curator of the scope they hold whenever they did not filter by their own category. curatorUnrestrictedScopeExists() now emits both forms from one definition, and its parameter is a two-literal union, not a string. accept-source reads curated_fields under OBJECT_LOCK (FOR NO KEY UPDATE, the one mode every writer takes on an object - it self-conflicts, so writers still serialise, and it does not conflict with the key share a foreign key takes, which is what stops a curator and a sync run deadlocking on one object) inside the transaction that rewrites it: the whole column is replaced, so a value read before the lock would discard a concurrent claim, and the lock is what makes \"is this field still claimed\" authoritative rather than a guess. POST /experiences/:id/publish is the fifth on the same predicate (ADR-0025, 2026-08-12): resolveExperienceScope for the grant, and the queue's three new sets — arrival, held, contents — carry CURATOR_SCOPED_REGIONS_CTE like the rest, so a region-scoped curator is only asked about, and can only publish, rows they cover. It is also the first curator route to take request-supplied child ids: locationIds and treasureIds are re-scoped inside the statements that consume them (WHERE experience_id = the locked row), so an id from another experience is discarded rather than published, and the response reports what was released rather than echoing what was asked for. The endpoint reads the row under OBJECT_LOCK and compares expectedSyncLogId with pending_change_sync_log_id, which is what makes \"is this the proposal the curator was shown\" authoritative rather than a guess — the same shape as accept-source, one column over. POST /experiences/categories/:categoryId/publish-waiting (ADR-0025, 2026-08-12) resolves scope per object rather than per category and reports what the caller does not cover as outOfScope, so a region-scoped curator releases only rows they hold and cannot mistake a short result for a cleared source; it reuses publishUnderLock per object, so the row lock, the staleness comparison and the per-object audit row are the same ones the single endpoint uses. It deliberately does not publish gate-held field proposals: applying one rewrites a row readers already see with a value nobody read, and satisfying the staleness check for a batch would mean passing each row's own stored pointer back to it — which would satisfy it falsely. POST /experiences/:id/decline-source (2026-08-14) is the sixth on the same predicate and the mirror of accept-source: resolveExperienceScope for the grant, curated_fields re-read under OBJECT_LOCK inside its own transaction, and expectedSyncLogId compared against the proposal resolved under that lock. The comparison matters in the opposite direction to accept-source's — accepting the wrong run writes a value nobody read, refusing the wrong run silences a proposal nobody read — and the refused value is taken from the locked row rather than the request, so a caller cannot record a refusal of something the source never proposed. It writes nothing to the experience. POST /experiences/:id/decline-held (ADR-0038, 2026-08-31) is the seventh, and answers one held row rather than the whole proposal: resolveExperienceScope for the grant, pending_change_sync_log_id re-read under OBJECT_LOCK, and expectedSyncLogId — required here rather than optional, since a per-row answer has nothing to be about without the run it answers — compared against it. The refused value is taken from the locked proposal exactly as decline-source's is, and is load-bearing for a second reason here: the readers suppress a held row only while the proposal is jsonb-equal to what was answered, so an answer recorded about a value nobody proposed would silence nothing while reporting success. The selection names rows by kind, reference, name and field and never by id — the record names a part and does not identify it (ADR-0026 decision 4) — and a name the locked proposal does not carry is refused with 409 rather than ignored, so a caller cannot file an answer against a row that is not open. It writes nothing to the experience and nothing to curated_fields, and clears the pointer only when nothing on the card is left open. POST /experiences/:id/publish took the same selection at the same time and reads its values from the same locked proposal, so the two answers are bounded by one rule rather than two. The gate switch itself (PUT /api/admin/sync/sources/:sourceId/curation-gate) is admin-only by its route's declared admin access (backend/src/routes/adminDeclaredRoutes.ts, ADR-0071) and writes experience_sources alone, so it can neither publish nor hide an existing row. The queue read was rebuilt on 2026-09-07 (ADR-0051, #805) and the predicate has a second place to be missing from, so it is carried in both: the keys union that chooses the page joins curator_scoped_regions in all seven of its branches - conflict, arrival, held, contents, withdrawn, refused, missing - before the search and before any facet, so no name outside the caller's scope can be reached through the search box or counted into a chip, and a test asserts the number of those joins rather than their presence, which is what makes a branch added without one fail instead of widening the queue silently. GET /experiences/review/queue/map (#2477, 2026-11-13) reads the same union through the same function (scopedQuestionsSql in reviewQueueKeys.ts) under the same chips (selectedSql), every question with its place's point and no page, so the map can name no place the list would not show the caller. POST /experiences/:id/admission-pin (#1367, 2026-10-12) answers the queue's pin-question card on the same predicate: answeredSourceId and resolveExperienceScope for the grant, the membership re-read under OBJECT_LOCK and required to belong to the place and to carry the question the card showed (409 otherwise), and the pin-question branch of the keys union carries the scope join like the rest. POST /experiences/:id/visit-question (#1770, 2026-10-21) answers the visit-question card the same way: answeredSourceId and resolveExperienceScope for the grant, the question re-read under OBJECT_LOCK with visitQuestionOpenSql and required to belong to that membership of the place (409 otherwise), and its keys branch carries the scope join. POST /experiences/:id/keep-out and GET /experiences/:id/kinds (#2022, 2026-10-25) follow it: the refusal resolves the named membership's source scope with answeredSourceId and resolveExperienceScope, and re-reads the membership under OBJECT_LOCK, required offered and of that place (409 otherwise); the read answers only a curator whose scope reaches the place (resolveExperienceScope with 'place', 403 otherwise, 404 for a missing place) and lists every kind of it with canAnswer from queueScopeSql on the membership's source, names the curator who kept a kind out only where the curation log's per-row rule would, and shows the note only within the caller's scope. POST /experiences/:id/kinds (#2035, 2026-10-26) puts a place into a kind no run offers it in on the same predicate: the kind's source (its first by display_priority) and resolveExperienceScope for the grant, the place re-read under OBJECT_LOCK and required to hold no membership in that kind (409 otherwise), World Heritage Sites refused; the kinds GET /experiences/:id/kinds offers for an add are filtered by queueScopeSql on each kind's source. POST /experiences/:id/parts, POST /experiences/:id/parts/take-out, GET /experiences/:id/parts and GET /experiences/:id/part-candidates (#2118, 2026-11-13) set and read a curator's word that a place is a part of a whole: a write changes two places, so its grant is resolveExperienceScope with 'place' on the whole and on the part, both required (403 otherwise), and each place's log row names the region its own grant came from; the two places are locked in id order and the pair re-read under the locks, so a word is written only about the pair as it stands (409 otherwise); the reads answer only a curator whose scope reaches the place, and check every row they return (2026-11-14): a part, a whole or a candidate is listed only when readers are offered it (placeOrPartOfferedSql) or the caller's scope reaches it (canCurateExperienceSql), so an unread place outside the scope is never named nor measured from as a candidate's nearest part, and an offered one outside it is returned as not choosable, as the write would refuse it; the note shown is read off the place's own history under the curation log's per-row rule (unrestricted, no region, or a region in the caller's closure), so a row naming a region outside the caller's scope reads as none. A word refused for a chain too deep names the chain's places by the same rule (2026-11-14, #2522): a place no reader is offered outside the caller's scope is null in the refusal's chain and only counted in its message. The crowding window and answers (#2282, ADR-0180, 2026-11-02) follow it too: GET /experiences/review/crowding/group and GET /experiences/review/crowding/place/:membershipId (#2358, 2026-11-04, replacing the window around one membership) list the places a reader is shown or that wait in a tail to any curator, as the region's page does, mark each one's canAnswer by queueScopeSql on its own source, and leave out an unread arrival outside the caller's scope, the place read answering it 404; GET /experiences/review/crowding/arrivals lists only arrivals within queueScopeSql; POST /experiences/review/crowding/answers resolves each body membership id's own source scope before any write, counts one outside it without naming it, and re-reads the membership under OBJECT_LOCK. GET /experiences/review/pins and POST /experiences/:id/admission-pin/hand-back (#1369) follow it: the list filters each pin by queueScopeSql on the membership's source and names the answering curator only where the curation log's per-row rule would, and the hand-back resolves the membership's source scope and re-reads the pin under OBJECT_LOCK Since #1893 (2026-10-23) a 'source' scope reaches a place as a whole when the place holds a membership of that source (curatorPlaceScopeExists in backend/src/middleware/auth.ts, the maintainer's decision), and an answer about one membership is scoped by the membership the writer answers: the named one, or the one waiting or refused that the writer picks unnamed (answeredSourceId). Before, an answer naming no membership was scoped by the place's first source while the writer could answer another source's membership. The first source (experiences.source_id) decides no scope now, and the lint rule provenance/no-first-source-key refuses a comparison with it."
