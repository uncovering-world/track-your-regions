      notes: "Body cap enforced via BodySizeLimitMiddleware (default 100 MB, override CV_MAX_BODY_BYTES). uvicorn invoked with --limit-concurrency 8 in Dockerfile so excess in-flight requests get 503 instead of stacking unbounded threads. Worker daemons still spawned per-request but bounded by uvicorn's gate. Fixed 2026-05-10."

