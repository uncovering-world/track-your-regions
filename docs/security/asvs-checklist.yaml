  V4_api_web_service:
    V4.1.1:
      desc: "CORS properly configured"
      level: 1
      status: pass
      notes: "Restricted to FRONTEND_URL origin with credentials; no wildcard"
    V4.1.2:
      desc: "Rate limiting on API endpoints"
      level: 1
      status: pass
      notes: "express-rate-limit on auth (login, register, refresh), geocode search (30/min), and experience search (30/min). Fixed 2026-02-10. Admin routes are otherwise unlimited by design — bulk workflows (batch match acceptance, geometry compute) legitimately issue many requests a minute — with the named exceptions below (no count: this note has twice been left one short by a route being added to it). (1) POST /wv-import/matches/:id/rematch carries expensiveAdminLimiter (5/min), because it deletes every region_members row for a world view and then spends 20-130s re-resolving them, so a repeat request costs more than the request and each run destroys the previous one output. The 409 guard stops concurrent runs but not rapid succession. Added 2026-07-30 (#456). (2) POST /experiences/:id/publish carries authenticatedLimiter (60/min) — the first route limited under requireCurator rather than requireAdmin, and deliberately a different limiter. It qualifies on the same criterion: where a publication releases a deferred withdrawal (ADR-0025) it re-places the object into every world view with geometry after committing, which is expensive regardless of who sends it. 60/min rather than 5/min because that branch fires only for a point that moved, an ordinary publish is one transaction, and a curator answers a queue in batches — the first gated round is about 18 arrivals, so 5/min would 429 mid-work to bound a branch most publishes never reach. (3) POST /experiences/:id/admission carries the same authenticatedLimiter (60/min), because it reaches the same post-commit placement rather than a similar one: overriding a refusal on a gated arrival publishes its contents through the shared publishContents, so it can release a deferred withdrawal, and setExperienceAdmission then calls placeAfterAdmissionRelease -> placeAfterRelease after releasing its client. The criterion decides per branch, not per endpoint. The curator routes that remain exempt (/:id/state, /:id/decline-source, /review/queue) are verified rather than assumed: each ends at res.json with nothing after its client.release(). /:id/accept-source was among them until it grew post-commit placement — see (7) — which is the second route to leave this list that way, so the list is re-read against the handlers rather than carried forward. /:id/decline-source (2026-08-14) is the plainest — it writes one row per refused field and does not touch the experience, since the value it refuses had already won every run — and CodeQL flags it like the rest, dismissed against this note. (4) POST /api/experiences/categories/:categoryId/publish-waiting carries authenticatedLimiter (60/min) as well, and is the clearest case of the criterion: it runs the publish transaction once per waiting object and can reach the post-commit region placement on any of them, so its cost scales with the source's backlog rather than with the request. (5) POST /api/experiences/locations/:locationId/state carries authenticatedLimiter (60/min) on the same criterion, decided per branch as always: an answer that leaves the point where it was is one locked row and one update, but an answer that changes what a reader sees re-places the point in either direction — a withdrawn point holds no auto region rows, because the run that marked it re-placed the experience and placement takes offered points only (measured: 0 rows against the offered point's 3), so revealing one must place it and hiding one must stop it counting toward a region. Either way it calls placeAfterRelease after committing, the same post-commit placement /:id/publish is limited for. Added 2026-08-15 (ADR-0026, #541). (6) PATCH /api/experiences/locations/:locationId/edit carries authenticatedLimiter (60/min) on the same criterion and without a branch to decide: a correction to a coordinate always calls placeAfterRelease after committing, since a point in a new place may fall in a different region, so unlike its sibling /:id/state there is no answer here that costs one locked row. A rename is the one shape that places nothing and it is not worth a second limiter. Added 2026-08-20 (ADR-0029). (7) POST /api/experiences/:id/accept-source carries authenticatedLimiter (60/min) as of 2026-08-21, having been on the verified-exempt list until then: accepting the object's coordinate now releases the claim on the point that carried it and puts that point back on the coordinate the run offered, so a place moves and placeAfterRelease runs after the client is released, exactly as it does for (6). Decided per branch as always - the five writable fields place nothing - and the limiter sits on the route because a route is what a limiter attaches to (ADR-0029). CodeQL js/missing-rate-limiting fires on every route this section exempts, on either router - the curator ones in experienceRoutes.ts and the admin gate switch PUT /api/admin/sync/categories/:categoryId/curation-gate in adminRoutes.ts, which stays exempt because it updates one row of a three-row table and changes only what future runs do - and each such alert is dismissed against this note. (8) GET /api/admin/data-assertions carries expensiveAdminLimiter (5/min) and POST /api/admin/data-assertions/accept carries authenticatedLimiter (60/min), and the split is the criterion applied twice rather than a compromise: the report runs a statement per assertion over the whole catalogue (~2.5s as of 2026-08-26; no count of them is written here for the same reason as above), which is expensive regardless of who sends it, while an acceptance re-runs one of those statements and inserts one row. Since #668 one of those statements takes about a second on its own, so the split is no longer an order-of-magnitude difference in work admitted per minute; what carries it is what each is a ceiling on - the report is a whole scan any caller can repeat at will, an acceptance is a person answering for one rule and runs out of rules to answer for. The bucket matters because the state that screen exists for is a database where nobody has answered for anything - a press per invariant - and every limiter here is keyed by IP, so five a minute is five for the whole address an admin works from and would refuse them halfway through their first pass. Added 2026-08-24 (ADR-0032). No count is written here because a count above a list is what goes stale when a route joins it. Added 2026-08-12 (ADR-0025). See docs/tech/rate-limiting.md section 5 for the named-exception table."
    V4.1.3:
      desc: "API responses don't leak sensitive data"
      level: 1
      status: pass
      notes: "500 errors return generic 'Internal server error' in production (err.message masked). Stack traces never sent. Fixed 2026-02-10"
    V4.1.4:
