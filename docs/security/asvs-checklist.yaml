    V2.2.1:
      desc: "Input is validated against business or functional expectations, by positive validation against an allowlist or against an expected structure and logical limits (L2: all input)"
      level: 1
      status: pass
      notes: "Node side: Zod schemas on all route files; string bounds for the world view, region, experience, account and admin AI request surfaces — eight tables — read their column widths from backend/src/db/schema.generated.ts, generated from the schema and held to it by the db:types gate (ADR-0064; a bound tighter than its column, such as a registration email at RFC 5321's 254, carries its reason as a literal), and a value that still overruns its column (22001) is answered 400 — quoting the width when the driver message carries one, generic otherwise — rather than falling through as a masked 500 (2026-07-28). cv-python uses FastAPI's `UploadFile`/`Form` declarations + `decode_image()` validation (raises InvalidImageBytes on null/empty/non-image bytes, returned as 400 by exception handler). The `params: str = Form(...)` + json.loads pattern is documented as a follow-up to migrate to Pydantic models — current behaviour: malformed JSON triggers a generic 500, no info leak (audit 2026-05-10)."
