  V8_authorization:
    V8.2.1:
      desc: "Authorization enforced server-side"
      level: 1
      status: pass
      notes: "All admin endpoints use requireAdmin. SSE geometry compute endpoint fixed to include requireAdmin. Fixed 2026-02-10. World view visibility is checked server-side too, via two mechanisms: requireVisibleWorldView guards the region/experience read surface (404, not 403) and getWorldViews filters the listing; GET /api/experiences/:id can't use either, since the experience itself is public, so it filters the regions[] it returns with the same predicate instead — and separately does 404 for an unread row from a gated source, which is not public (ADR-0025). See V8.3.1 for detail."
    V8.3.1:
      desc: "Users can only access their own data (IDOR protection)"
      level: 1
      status: pass
      notes: "All user-scoped queries use /me/ pattern with req.user.id. No URL-based user ID accepted for personal data. World view visibility is enforced by two mechanisms, shaped by what each route can answer. (1) requireVisibleWorldView guards region reads, experience-by-region reads, and the region-scoped experience list/locations reads (regionId as a route param or a query param); it answers 404 rather than 403, so existence is not confirmed. (2) GET /api/experiences/:id (getExperience) can't 404 on *world-view* visibility — the experience itself is public data, only its world-view association is sensitive — so it instead filters the regions[] array it returns, using the same is_active/is_public predicate as getWorldViews. That sentence stopped being the whole story with ADR-0025: the same route now does 404 on a different axis, because an unread row from a gated source (curation_state = 'pending') is not public data at all — no read has ever shown it — so /:id, /:id/locations and /:id/treasures answer 404/empty for it and widen only for a curator or admin whose scope reaches the experience (maySeeUnreadExperience). Two axes, two different answers, and the reason they differ is what each hides: a hidden world view is a fact about our organisation of public objects, an unread row is an object nobody has vouched for. POST /experiences/:id/publish is the one route that accepts caller-supplied child ids (locationIds, treasureIds); both arrays are re-scoped inside the statements that consume them, so an id belonging to another experience is discarded rather than trusted — see SECURITY.md. Added 2026-08-12 (ADR-0025). The regions[] array gained a second filter on that same second axis on 2026-08-24 (#521): a region is named only where the object has a point there that this caller may see, so an assignment a gated run made on an unread point no longer discloses the region it landed in — placement writes such a point into experience_regions deliberately (ADR-0025 decision 5), and every reader-facing region read now asks readerRegionMembershipSql() rather than reading that roll-up bare. It is relaxed on the same maySeeUnreadExperience boolean as the row itself, for the reason /:id/locations is: a curator reading a queue item has to be shown where publishing will put it. A manual assignment is exempt, having been made by a curator rather than derived from a point."
    V8.3.2:
      desc: "Curator scope enforcement"
      level: 1
      status: pass
      notes: "checkCuratorScope() validates global/category/region scopes with recursive CTE — those three are what curator_assignments.scope_type permits in db/init/01-schema.sql, where 'category' replaced the original 'source' scope. Earlier notes here said 'source': a database provisioned from db/migrations/001-curator-system.sql still carries the older CHECK and may hold scope_type = 'source' rows, since no migration converts them and 01-schema.sql's CREATE TABLE IF NOT EXISTS will not rewrite the constraint (no ledger records which migrations a database has seen — #435). No code path grants access for such a row: resolveCurationLogScope matches only 'global'/'category', CURATOR_SCOPED_REGIONS_CTE only 'region', so a source assignment yields no scope rather than wrong scope. The TypeScript union still spells the stale set — #452. getCurationLog's check was added 2026-02-10 but qualified one arbitrary region of the experience while the response carried rows for all of them (#442); it now resolves scope against everything in the log attributable to the caller — the experience's assigned regions and the regions its log rows already name — and filters the rows themselves through CURATOR_SCOPED_REGIONS_CTE, so a region-scoped curator sees only the entries for regions they cover. Fixed 2026-07-29. editExperience carried the same one-arbitrary-region shape on the write path (#450): an unordered LIMIT 1 over experience_regions both decided the 403 — refusing a curator who was in scope whenever it returned another of the experience's regions — and landed on the audit row, which since the log change above hid the edit from its own author. It now intersects the experience's assignments with CURATOR_SCOPED_REGIONS_CTE for the grant, and names on the log row a region the caller covers (NULL for admins, global curators, and curators of the category, whose authority came from no one region). The other curation handlers are told their region by the request, so none of them shares the shape. Fixed 2026-07-29. The review queue (GET /experiences/review/queue, POST /experiences/:id/state, POST /experiences/:id/accept-source, added 2026-08-03) runs on the same predicate: the two write endpoints reuse resolveExperienceScope, and the queue — the first set-returning caller — qualifies rows with CURATOR_SCOPED_REGIONS_CTE. POST /experiences/:id/admission joins them unchanged (ADR-0024, 2026-08-08): resolveExperienceScope for the grant, and the queue's fourth set — keptOut, the refusals a curator confirmed — carries the same CTE, so a region-scoped curator can only take back a withdrawal they could have made. That set exists because the withdrawal is otherwise irreversible: hideRefusedSql rides on no reader toggle, so a confirmed row is reachable on no other surface, and override therefore stays permitted on a pinned row while confirm does not — the asymmetry is the audit-relevant part, since only confirm hides. Its rows span categories, so it correlates the unrestricted check on e.category_id rather than on the caller's optional categoryId filter; binding $3 there would have measured every row against one request parameter and silently stripped a category curator of the scope they hold whenever they did not filter by their own category. curatorUnrestrictedScopeExists() now emits both forms from one definition, and its parameter is a two-literal union, not a string. accept-source reads curated_fields under OBJECT_LOCK (FOR NO KEY UPDATE, the one mode every writer takes on an object - it self-conflicts, so writers still serialise, and it does not conflict with the key share a foreign key takes, which is what stops a curator and a sync run deadlocking on one object) inside the transaction that rewrites it: the whole column is replaced, so a value read before the lock would discard a concurrent claim, and the lock is what makes \"is this field still claimed\" authoritative rather than a guess. POST /experiences/:id/publish is the fifth on the same predicate (ADR-0025, 2026-08-12): resolveExperienceScope for the grant, and the queue's three new sets — arrival, held, contents — carry CURATOR_SCOPED_REGIONS_CTE like the rest, so a region-scoped curator is only asked about, and can only publish, rows they cover. It is also the first curator route to take request-supplied child ids: locationIds and treasureIds are re-scoped inside the statements that consume them (WHERE experience_id = the locked row), so an id from another experience is discarded rather than published, and the response reports what was released rather than echoing what was asked for. The endpoint reads the row under OBJECT_LOCK and compares expectedSyncLogId with pending_change_sync_log_id, which is what makes \"is this the proposal the curator was shown\" authoritative rather than a guess — the same shape as accept-source, one column over. POST /experiences/categories/:categoryId/publish-waiting (ADR-0025, 2026-08-12) resolves scope per object rather than per category and reports what the caller does not cover as outOfScope, so a region-scoped curator releases only rows they hold and cannot mistake a short result for a cleared source; it reuses publishUnderLock per object, so the row lock, the staleness comparison and the per-object audit row are the same ones the single endpoint uses. It deliberately does not publish gate-held field proposals: applying one rewrites a row readers already see with a value nobody read, and satisfying the staleness check for a batch would mean passing each row's own stored pointer back to it — which would satisfy it falsely. POST /experiences/:id/decline-source (2026-08-14) is the sixth on the same predicate and the mirror of accept-source: resolveExperienceScope for the grant, curated_fields re-read under OBJECT_LOCK inside its own transaction, and expectedSyncLogId compared against the proposal resolved under that lock. The comparison matters in the opposite direction to accept-source's — accepting the wrong run writes a value nobody read, refusing the wrong run silences a proposal nobody read — and the refused value is taken from the locked row rather than the request, so a caller cannot record a refusal of something the source never proposed. It writes nothing to the experience. The gate switch itself (PUT /api/admin/sync/categories/:categoryId/curation-gate) is admin-only by the /api/admin mount and writes experience_categories alone, so it can neither publish nor hide an existing row"
    V8.1.1_cvpy:
      desc: "cv-python authorization model"
      level: 2
      status: pass
      notes: "Service has no per-request authn/authz. Trust derives from Docker network isolation: no `ports:` mapping in docker-compose.yml (only `expose: 8000`), service reachable only at http://cv-python:8000 from other containers on the bridge. Documented as a trust boundary in SECURITY.md. If cv-python ever moves out of the bridge or onto a shared cluster, a shared-secret header or mTLS becomes mandatory — tracked as a follow-up. Verified 2026-05-10."

