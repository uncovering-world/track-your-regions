    V1.3.6:
      desc: "Server-side request forgery is prevented: untrusted data is validated against an allowlist of protocols, domains, paths and ports before another service is called"
      level: 2
      status: pass
      notes: "Two outbound requests take their destination from data rather than from code. A picture the server fetches (the CV map pipeline, the admin image proxy) goes through fetchPicture (services/pictureFetch.ts): an allowlist of hosts, every redirect hop re-read by the same rule, at most five (#706). An official website a review card checks (GET /api/experiences/:id/website-checks, #2165) can name any host, so it is held to the address instead (services/websiteCheck/): only http and https on ports 80, 443, 8080 and 8443, no credentials in the URL; every hop's name resolved and refused when any address it resolves to is not public (publicAddress.ts: loopback, private, link-local and so the cloud metadata services, carrier-grade NAT, unique-local, multicast, documentation and reserved ranges, and the IPv6 transition prefixes that embed an IPv4 address), the connection made to the address checked (guardedLookup, so a name cannot resolve differently between the check and the connection), a literal address checked directly, at most five redirects, a ten-second deadline for the chain; the response destroyed once its status and headers arrive, so no body is read; no cookie, Referer or Authorization sent. The endpoint takes the place's id only: the addresses are read from the catalogue's rows, and a query naming one is refused by the route. checkWebsite.test.ts runs the chain against a local server, the refusal of a named, literal and redirected private address included. 2026-10-31. The picture classes of a review card (GET /api/experiences/:id/picture-classes, #2192) take the place's id only too, and their one outbound request goes to Wikimedia Commons' API with the stored files' names as its titles (services/pictureClass/), so no stored address is fetched. 2026-10-31. The search for whom a place commemorates (GET /api/experiences/commemorates/search, #2144) goes to one fixed host, Wikidata's Action API, with the curator's text as a query parameter only, so the destination is the code's; the article a curator saves with a subject is held to https://en.wikipedia.org/wiki/ (isEnglishWikipediaArticleUrl) and is never fetched by the server. 2026-11-09"
