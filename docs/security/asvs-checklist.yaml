  V14_data_protection:
    V14.1.1:
      desc: "All sensitive data created and processed is identified and classified into protection levels (encoded data such as a JWT payload included), with regard to applicable regulations"
      level: 2
      status: pass
      notes: "Since 2026-11-15 (#2554) the data is classified in four protection levels in SECURITY.md § Data Classification: secrets (password hashes, tokens, OAuth codes, keys), a traveller's history (visits, trip dates, notes, ratings, the date offer's session), personal contacts (email, display name, account and provider ids) and preferences and public data, read against the GDPR (personal data, Art. 9 special categories and what can be inferred from data), the CPRA's precise geolocation and OWASP's browser-storage guidance. Earlier: User travel data, visited regions, auth tokens identified as sensitive. The dates of a traveller's trips (user_visit_trips, #2120, ADR-0202) are travel data of the same class: read and written only under /api/users/me, of the caller's own visits"
    V14.1.2:
      desc: "Each sensitive data protection level has documented protection requirements (encryption, integrity, retention, logging, access, database encryption, privacy)"
      level: 2
      status: partial
      notes: "SECURITY.md § Data Classification states, for each level, where its data may be and where it never is: secrets only on the server, in the refresh token's httpOnly cookie or the page's memory; a traveller's history read only by its owner (private, no-store) and in browser storage only where a feature needs it across a reload, minimal, owner-keyed, tab-scoped and cleared on a change of who is signed in; personal contacts read by their owner and admins, never logged (an admin grant is logged by user id alone), on the device only as the sign-in hint until sign-out; preferences anywhere (2026-11-15, #2554). Partial: encryption at rest, database encryption and retention per level are not stated there yet."
    V14.2.1:
      desc: "Sensitive data is sent to the server only in the HTTP body or header fields; URLs and query strings carry no sensitive information such as an API key or session token"
      level: 1
      status: partial
      notes: "OAuth callback uses one-time authorization code in URL. Tokens exchanged via POST /api/auth/exchange-code (refresh set as httpOnly cookie). Fixed 2026-02-10. Filed as V14.3.2 until 2026-08-29, whose ASVS 5.0 requirement is the anti-caching one, then kept under the descriptive key oauth_tokens_not_in_urls, and filed as V14.2.1 since 2026-11-15 (#2524), the 5.0 requirement this entry checks. Partial since 2026-11-15 (#2524): V14.2.1 covers every URL, and the three server-sent event streams take the access token as a ?token= query parameter, because EventSource cannot send a header (requireAuth in backend/src/middleware/auth.ts reads req.query.token; the streams are opened in frontend/src/api/geometry.ts, frontend/src/api/admin/wvImportCvMatch.ts and frontend/src/api/admin/wvImportCoverage.ts), as V14.2.2 and V14.3.2 already record. The email verification link carries its one-time token in the query string as well (verify-email?token=, backend/src/services/emailService.ts)."
    V14.2.2:
      desc: "Sensitive data is not cached in server components such as load balancers and application caches, or is securely purged after use"
      level: 2
      status: pass
      notes: "No shared cache is deployed in front of the API today, and the responses now say what one may do with them rather than relying on that. Every response shaped by the caller — the world view listing, the optional experience reads, every read with a world view scope — is marked Cache-Control: private, no-cache with Authorization appended to Vary, by its declared optional access and revalidate policy (backend/src/api/route.ts, ADR-0071), so a proxy or CDN cannot store an admin's or a curator's answer under the URL alone and hand it to a visitor; auth.test.ts holds the headers on the wire beside CORS's own Vary, and a declared route cannot give a public handler its caller (ADR-0071), so a caller-shaped read cannot drop the policy unnoticed. 2026-08-29, #597 (the listing alone had it since #460). The requireAuth responses are kept out of a shared cache twice over where the token travels in the header: RFC 9111 § 3.5 forbids storing the answer to such a request, and since #710 requireAuth marks each one private, no-store — for the one caller that cannot send that header — the streams EventSource opens, which take the token as a query parameter — the private is the whole of it — the browser-side half of that header is recorded under V14.3.2."
    V14.2.3:
      desc: "Defined sensitive data is not sent to untrusted parties such as user trackers"
      level: 2
      status: not-checked
      notes: "Not yet audited against the code under ASVS 5.0 (added 2026-11-15, #2524)."
    V14.2.4:
      desc: "Controls for sensitive data (encryption, integrity, retention, logging, access to logs, privacy) are implemented as documented for its protection level"
      level: 2
      status: not-checked
      notes: "Not yet audited against the code under ASVS 5.0 (added 2026-11-15, #2524)."
    V14.3.1:
      desc: "Authenticated data is cleared from client storage, the browser DOM included, after the client or session is terminated"
      level: 1
      status: pass
      notes: "Pass since 2026-11-15 (#2554): signing out clears the Google sign-in hint (tyr-last-google-email, clearLastGoogleEmail in useAuth's logout) as well as everything else, so a traveller who leaves a shared device leaves no address on it; a session that expires keeps the hint, which SECURITY.md § Data Classification places with personal contacts and keeps for the account's next sign-in. The rest: authenticated data the web keeps outside the query cache is forgotten with it on every change of who is signed in (sign-in, email verification, OAuth, sign-out, an expired session: forgetIdentity in useAuth.tsx): the visits a traveller's last untick removed, held in memory for its Undo, and the date line a tick opens with the offer's session (the ticks' places and times, the mode and the carried year), held in the trips chunk's memory and, so a reload keeps it, in sessionStorage as tyr.tripOfferSession with its coordinates rounded (#2536), each of which also records its owner and answers no one else (#2120). What the trips offer stores, that session and 'Don't ask in this session' as tyr.tripOfferSilence (V14.3.3), is cleared when the tab closes, as sessionStorage is, on sign-out and every other change of who is signed in (forgetTraveller), and by a load of the tab that finds the session over or another account's (forgetStoredOtherThan, called from useAuth.tsx), which is what V14.3.1 asks of authenticated data once the session ends. Every step after a tick's own start (the trips chunk arriving, a choice on the line) checks again that the tick's sign-in is current (isCurrentOrigin in visitRemovals.ts) before it stores or writes anything. A refresh that returns another account than the tab held, as after a sign-in in another tab, counts as such a change, and apiFetch sends no request, nor retries one, under another account than the one that made it (refuseAnotherAccount in fetchUtils.ts)"
    V14.3.2:
      desc: "Sufficient anti-caching response header fields (Cache-Control: no-store) keep sensitive data out of browser caches"
      level: 2
      status: pass
      notes: "requireAuth (backend/src/middleware/auth.ts) sends Cache-Control: private, no-store and appends Authorization to Vary on every response it lets through, ahead of the token check so the 401s carry it too. That covers two of the three levels SECURITY.md § Data Classification protects on the server: a traveller's history — the reads under /api/users/me — and personal contacts — the profile with its email — together with every read behind requireAdmin or requireCurator. The third, secrets (auth tokens), is mostly not requireAuth's to cover: four of the five responses carrying accessToken in their body — POST /api/auth/login, /verify-email, /refresh and /exchange-code — are what a caller gets before holding a token, so they sit ahead of this middleware and would answer with Express's defaults (POST /api/auth/register carries none: it answers with a message, the same one whether or not the account existed). The fifth, POST /api/auth/change-password, is behind requireAuth and does carry private, no-store. All five now say private, no-store for themselves through the token cache policy their routes declare (backend/src/api/route.ts, ADR-0071; routerOf refuses any route whose response schema declares accessToken under another policy), which also sets the Pragma: no-cache the same RFC asks for — deprecated in a response by RFC 9111 § 5.4 and read by nothing here, so it states the intent for an auditor rather than changing behaviour: a browser stores no POST response in its HTTP cache, which is what these are, but RFC 6749 § 5.1 asks a token response for the header outright and an argument from the method is a guarantee about caches rather than about the endpoint. The reads that needed the header are the visited-data ones: before #710 they answered with Express's defaults — a weak ETag, no Cache-Control — so the browser stored the body and served it back on 304 after sign-out, on whatever machine the traveller had used. A handler that needs another value sets it after the middleware and wins, since setHeader replaces: the three SSE streams keep private, no-cache (by their declared revalidate policy, ADR-0071) — private rather than § 3.5 is what keeps a shared cache off those, since EventSource cannot send a header and the streams take the token as a query parameter — the four admin image endpoints their declared max-age, and the reads whose body is public reference data behind the auth gate private, no-cache — the division geometry read by its route's declared revalidate policy (backend/src/api/route.ts, ADR-0071). /api/divisions is admin-gated because the editor is its only caller, not because GADM boundaries are anyone's own data; no-store there would trade a 304 for the whole body on every dialog open while protecting nothing. The rule has one owner: every route declares its cache policy and the route registry (backend/src/api/route.ts) writes the header — public, no-cache only for a route declared public, public, max-age only for a policy that states its reason beside it (the admin image proxy's alone), which routerOf refuses when empty; a route written around the registry with its path spelled out fails lint (ROUTE_REGISTRY_RULES, pinned in both directions by routeRegistryLint.test.ts), so the Cache-Control lint rules and cacheOverrides.test.ts, which held hand-written overrides, went with the last of them (#793). The optionalAuth reads keep no-cache rather than no-store deliberately: they hold nothing V14.1.1 classifies as sensitive, and the round-trip is worth hundreds of kilobytes per read (V14.2.2). auth.test.ts holds the header on a fake res, on both 401 paths and on the wire beside an SSE handler whose own no-cache still wins; every route on the user router is declared signed-in (ADR-0071), which builds requireAuth into its chain. 2026-08-29, #710"
    V14.3.3:
      desc: "Data in browser storage (localStorage, sessionStorage, IndexedDB, cookies) contains no sensitive data, session tokens excepted"
      level: 2
      status: pass
      notes: "Pass since 2026-11-15 (#2554): by SECURITY.md § Data Classification no secret is in browser storage, the one piece of a traveller's history there is the date offer's session, an accepted exception stated below, and the one personal contact there, the Google sign-in hint (tyr-last-google-email), is contact data kept until sign-out rather than sensitive data. refresh token in httpOnly cookie (not accessible to JS): a session token, which the requirement excepts. Access token in memory. Otherwise only non-sensitive data (theme, a signed-out visitor's maps app as tyr.mapsApp, #1604, and reading languages as tyr.readingLanguages, #2209) in localStorage, and the world view last open as tyr.lastWorldViewId in sessionStorage (#2474: a world view id, public, read by the review page's links). Fixed 2026-02-10. Accepted exception: a traveller's history, which SECURITY.md § Data Classification counts as sensitive data, is in browser storage only where that section allows it. The maintainer accepted that rule with the classification on 2026-11-15 (#2554), and it is stated there as the 'where it may be' of the level, so this row records a decided waiver, not an oversight: the trips offer keeps its session in sessionStorage as tyr.tripOfferSession (the ticks' places and times, the mode, the carried year and the places and trips it guessed, as names and ids, with every coordinate rounded to two decimals) with the account id it is for, read back only for that account and removed at every change of who is signed in (#2536), and 'Don't ask in this session' as tyr.tripOfferSilence, the time it lasts until (at most 12 hours) and the account id it is for (#2120). Both end with the tab. Every use of localStorage, sessionStorage, indexedDB and document.cookie in frontend/src was read on 2026-11-15 (#2524), and these are all of them: the last-used email is the address of the last Google sign-in, kept as tyr-last-google-email for Google's login_hint (setLastGoogleEmail in frontend/src/api/auth.ts, written by useAuth.tsx after a Google sign-in); the theme is theme-mode (AppThemeContext.tsx); tyr.mapsApp, tyr.readingLanguages, tyr.lastWorldViewId, tyr.tripOfferSession and tyr.tripOfferSilence are written by useMapsApp.tsx, useReadingLanguages.tsx, utils/lastWorldView.ts and shared/trips/dateOffer.ts; and the world view editor's subdivision dialog keeps an admin's working state per region (custom-subdivision-dialog-state-<regionId> and ai-group-descriptions-<regionId>: groups, AI suggestions and descriptions, overlay settings, request counts), which is work on a world view's regions rather than anyone's travel data or a token. No IndexedDB and no script-written cookie is used; useAuth.tsx only removes a refresh token that old versions kept in localStorage (tyr-refresh-token)."

