    V1.2.2:
      desc: "Untrusted data in dynamically built URLs is encoded for its context, and only safe URL protocols are permitted (no javascript: or data:)"
      level: 1
      status: pass
      notes: "External URLs use encodeURIComponent(). Curator URL fields (imageUrl, websiteUrl, wikipediaUrl) are validated server-side: first against a denylist of unsafe schemes (javascript:, data:, vbscript:, blob:), fixed 2026-02-10, and since 2026-08-28 against an allowlist instead. Picture credits from Wikimedia Commons (author, licence, licence URL) are third-party text: the author is reduced to plain text before storage and the licence URL is kept only when it parses as an absolute http(s) URL (imageCredit.ts safeHttpUrl); ImageCreditLine checks again before assigning any href and renders unlinked text otherwise. 2026-08-22. An experience's or treasure's picture makes the guarantee on the rendering path too, where the value reaches the DOM, rather than borrowing it from the write path: extractImageUrl and toThumbnailUrl (frontend/src/utils/imageUrl.ts) keep only an absolute http(s) url on a Wikimedia Commons host (under /wikipedia/commons/ on upload.wikimedia.org) that names a picture file and is not the /wiki/File: page about one, or an /images/ path whose origin survives resolution, so neither a foreign scheme nor a path that names a foreign authority (//host/x, /\\host/x) nor a host whose terms do not license the picture can reach that img src (ADR-0043, 2026-09-01). It is load-bearing rather than a third copy: a sync writes image_url through no request schema at all, and every row already stored predates the write-path rule. That write-path rule is itself an allowlist since #693, declared once in backend/src/types/urlSafety.ts and put to the URL parser rather than matched against the raw string: an absolute http(s) url for a link; for a picture, a Wikimedia Commons picture file — on a Commons host, under /wikipedia/commons/ on the upload host, naming a picture and not its /wiki/File: description page — or an /images/ path on our own origin (isDisplayablePictureUrl, ADR-0043 — a run is held to the narrower isCommonsPictureUrl, which admits no local path, at the sync upsert, the works writer and the picture repairs; the host and file-type lists are one declaration, @tyr/shared/pictures, that the drawing side imports too (ADR-0065)), so a scheme behind a leading space or split across a tab (\"java<tab>script:\") is refused rather than stored, and the two denylist spellings that used to sit in types/index.ts and curationController.ts and disagree about whitespace are gone. urlSafety.test.ts pins both the behaviour and the single declaration. The other stored picture, a region's imported map (region_map_url), is held to the same rule on both sides since #694: on the way in, the import tree's regionMapUrl and mapImageCandidates, the map-image pick and the vision-match url read isStorableHttpUrl from urlSafety.ts (an absolute http(s) url and nothing else — no map is a path on our own origin), where each used to be z.string().url(), which is new URL() in a try/catch and accepts javascript: and data:; where it is drawn, every dialog goes through toThumbnailUrl or extractImageUrl, so the value never reaches a src raw, and urlSafety.test.ts reads every frontend component to hold it there. 2026-08-28. Two stored links are held to the rule on both sides. A region's source page (region_import_state.source_url), since #703: the import tree node, add-child and rename schemas read isStorableHttpUrl where each was z.string().url(), and the five surfaces that offer the page (four hrefs and one window.open, which React does not guard the way it guards an href) go through safeHref (frontend/src/utils/safeHref.ts, lifted out of ImageCreditLine); a refused page is not linked. An experience's website and Wikipedia article (metadata.website, metadata.wikipediaUrl; website_url / wikipedia_url on a review card), since #708: held to the rule when a curator writes them and not at all when a sync does, they are offered through safeHref in Discover's detail panel, the Map mode card and the review card's ObjectContext, and a refused value gets no button or link. A World Heritage part's own article (metadata.wikipediaUrl on its part's row, #1963, ADR-0156) is held to isStorableHttpUrl by the run's writePointContents and by claimPointItem, and offered through safeHref on the part's PointCard and its row (PointArticleLink), 2026-10-25. urlSafety.test.ts reads every frontend module (.ts and .tsx) that carries a stored link — sourceUrl, a credit's licenseUrl / detailsUrl, so ImageCreditLine is read too, and an experience's website / wikipediaUrl / website_url / wikipedia_url — and fails on a dynamic href, a window.open or a .href assignment whose expression is anything but a safeHref call or a url the file spells itself (a literal, or a template opening on https://); safeHref(x) || x counts as raw, a bare name is followed to every binding the file gives it, and an unbound name counts as raw. 2026-08-28; the experience links 2026-10-14. The two reads that fetch a picture from the server rather than draw it — the CV colour-match pipeline's read of a region's map (runSourceMapPipeline) and the admin image proxy (GET /api/admin/image-proxy) — go through fetchPicture (services/pictureFetch.ts) and call the address pictureFetchUrl (urlSafety.ts) builds, never the value they were handed: an origin of ours per host in PICTURE_HOSTS, matched host for host, with the value's path under it segment by segment and its query after a ? of ours, so an import tree node or a query string naming 127.0.0.1, a port or a user@ is refused before any request leaves (#706; the proxy used to take any *.wikimedia.org / *.wikipedia.org by suffix and the pipeline took anything). The rule binds every hop and not only the first: redirects are taken by hand (redirect: manual, at most five), each Location is re-read by the same rule before it is requested, and a chain leaving those hosts ends in null rather than bytes — which matters because the proxy hands the final bytes to its caller. A hop may also land on thumb.wikimedia.org, where Commons serves a picture it has to scale (?width=800, measured 2026-09-19 and re-runnable with the curl recorded in urlSafety.ts; a file narrower than the width asked for comes from upload instead); a value handed in may not start there. urlSafety.test.ts holds the rule and that neither reader calls fetch itself, pictureFetch.test.ts holds the chain and its ceiling. 2026-09-19"
