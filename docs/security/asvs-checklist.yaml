  V5_file_handling:
    V5.1.1:
      desc: "Documentation defines the permitted file types, extensions and maximum size (unpacked included) for each upload feature, and how files are made safe"
      level: 2
      status: not-checked
      notes: "Not yet audited against the code under ASVS 5.0 (added 2026-11-15, #2524)."
    V5.2.1:
      desc: "Only files of a size the application can process without loss of performance or denial of service are accepted"
      level: 1
      status: pass
      notes: "Content-Length pre-check + 20MB Transform stream limit on Node-side downloads. Oversized downloads rejected or aborted mid-stream. Fixed 2026-02-10"
    V5.2.1_cvpy:
      desc: "cv-python service: only files of a size the application can process without loss of performance or denial of service are accepted"
      level: 1
      status: pass
      notes: "BodySizeLimitMiddleware rejects requests with Content-Length > CV_MAX_BODY_BYTES (default 100 MB) before they're buffered, returning 413. Streaming uploads without Content-Length flow through but are gated by uvicorn's --limit-concurrency. Fixed 2026-05-10. Merged from the row filed as V4.1.5_cvpy until 2026-11-15 (#2524): Body cap enforced via BodySizeLimitMiddleware (default 100 MB, override CV_MAX_BODY_BYTES). uvicorn invoked with --limit-concurrency 8 in Dockerfile so excess in-flight requests get 503 instead of stacking unbounded threads. Worker daemons still spawned per-request but bounded by uvicorn's gate. Fixed 2026-05-10."
    V5.2.2:
      desc: "An accepted file's extension matches an expected one and its content matches the type the extension represents (magic bytes, image rewriting, content validation; L2: all files)"
      level: 1
      status: pass
      notes: "imageService checks content-type starts with image/"
    V5.2.2_cvpy:
      desc: "cv-python service: an accepted file's extension matches an expected one and its content matches the type the extension represents (magic bytes, image rewriting, content validation; L2: all files)"
      level: 1
      status: pass
      notes: "decode_image() in cv-python/app/utils/image.py raises InvalidImageBytes on empty bytes or when cv2.imdecode returns None (i.e. not a recognised image). Routed via FastAPI exception handler to a 400 with a generic detail string. Fixed 2026-05-10."
    V5.2.2_overlay:
      desc: "Uploaded reference map (#595): an accepted file's extension matches an expected one and its content matches the type the extension represents (magic bytes, image rewriting, content validation; L2: all files)"
      level: 1
      status: pass
      notes: "PUT /api/world-views/regions/:regionId/image-overlay (admin only) takes the image as a data URL of PNG, JPEG or WebP; decodeOverlayImage (controllers/worldView/regionImageOverlay.ts) checks the bytes against the declared type's signature and caps them at 10 MB, and the table's CHECKs hold the same types and cap. SVG, which can carry script, is refused; the dialog rasterizes it to PNG first. Stored as bytea in region_image_overlays (ADR-0113), never on disk, and read back by admins only. The body's sourceUrl, the region map the image was loaded from (#2087), is held to an absolute http(s) address by isStorableHttpUrl and by the region_image_overlays.source_url CHECK, and is never fetched. Added 2026-10-16."
    V5.2.3:
      desc: "Compressed files are checked against a maximum uncompressed size and file count before they are uncompressed"
      level: 2
      status: not-checked
      notes: "Not yet audited against the code under ASVS 5.0 (added 2026-11-15, #2524)."
    V5.3.1:
      desc: "Files uploaded or generated from untrusted input and stored in a public folder are not executed as server-side code"
      level: 1
      status: pass
      notes: "Images stored in /data/images/, not in executable paths"
    V5.3.2:
