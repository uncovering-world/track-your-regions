      level: 2
      status: pass
      notes: "FastAPI exception handler in app/middleware.py catches Exception, prints traceback to stderr (Docker stdout), and returns {'detail':'Internal error'} with 500. NDJSON streaming worker similarly returns {'type':'error','message':'Internal error during processing'} instead of str(exc). InvalidImageBytes is the one allowlisted exception that surfaces a generic message via 400. Fixed 2026-05-10."

