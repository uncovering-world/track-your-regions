services:
  # One IP is not one visitor here: every request in this stack comes from a
  # single browser container, so the whole smoke suite shares one per-IP read
  # budget. It crossed the production ceiling of 60 reads a minute the day a
  # twelfth spec arrived (#592), and the failure named nothing — the world-view
  # listing answered 429, the client read that as an empty list, and the app
  # drew its "fresh installation" screen with no world view to adopt. Raised
  # rather than switched off, so a runaway loop is still stopped by something.
  # The backend defaults to the production values when these are unset; nothing
  # outside this file sets them.
  backend:
    environment:
      RATE_LIMIT_PUBLIC_READ_MAX: "10000"
      RATE_LIMIT_SEARCH_MAX: "10000"

  e2e:
    build:
      context: ./frontend
      dockerfile: Dockerfile.e2e
    container_name: ${STACK_NAME:-tyr-ng}-e2e
    environment:
      E2E_BASE_URL: http://frontend:5173
      CI: "1"
    volumes:
      # So Playwright's HTML report and test-results/ (screenshots, videos,
      # traces on failure - both written relative to /app, this image's
      # WORKDIR) survive `docker compose down` in scripts/test-stack.sh,
      # instead of disappearing with the container. Both are gitignored;
      # scripts/test-stack.sh pre-creates and opens up permissions on both
      # host paths before this service starts (its base image runs as root).
      - ./frontend/playwright-report:/app/playwright-report:z
      - ./frontend/test-results:/app/test-results:z
      # Lighthouse's HTML/JSON reports, manifest and assertion results (the
      # `outputDir` in frontend/perf/lighthouse-budgets.json), for the same
      # reason as the two above.
      - ./frontend/lighthouse-report:/app/lighthouse-report:z
    depends_on:
      - frontend
    command: ["bash", "-lc", "sleep infinity"]
    profiles:
      - test
